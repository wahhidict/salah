<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فواكه أبو صلاح | المنيو الإلكتروني</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #05140d; color: #fff; min-height: 100vh; padding-bottom: 110px; }
    
    /* Header & Ticker */
    .header { background: rgba(8, 29, 19, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; padding: 15px; text-align: center; }
    .logo-title { font-size: 1.6rem; font-weight: 900; color: #f39c12; margin-bottom: 4px; }
    .status-badge { display: inline-block; background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #27ae60; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    
    .ticker-wrap { background: #f39c12; color: #05140d; font-weight: 800; font-size: 0.85rem; padding: 6px 0; overflow: hidden; white-space: nowrap; }
    .ticker { display: inline-block; animation: marquee 18s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    .container { padding: 15px; max-width: 700px; margin: 0 auto; }

    /* Categories */
    .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .cat-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #ccc; padding: 8px 18px; border-radius: 25px; font-weight: 700; font-size: 0.88rem; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn.active { background: #f39c12; color: #05140d; border-color: #f39c12; }

    /* Items Grid */
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .item-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative; transition: transform 0.2s; }
    .item-card:active { transform: scale(0.98); }
    .item-img { width: 100%; height: 130px; object-fit: cover; background: #111; }
    .item-info { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-weight: 800; font-size: 0.95rem; color: #fff; margin-bottom: 4px; }
    .item-desc { font-size: 0.75rem; color: #a4c2b2; margin-bottom: 8px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-price { font-weight: 900; color: #ffe082; font-size: 0.9rem; }
    
    .add-btn { background: #f39c12; color: #05140d; border: none; padding: 8px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 8px; font-size: 0.85rem; width: 100%; }
    .unavailable-badge { position: absolute; top: 8px; right: 8px; background: rgba(198, 40, 40, 0.9); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; }

    /* Cart Bar */
    .cart-bar { position: fixed; bottom: 20px; left: 15px; right: 15px; max-width: 670px; margin: 0 auto; background: #27ae60; color: white; padding: 14px 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-weight: 800; z-index: 99; cursor: pointer; }
    .cart-btn-send { background: #fff; color: #1e8449; padding: 6px 14px; border-radius: 12px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-title">🍓 فواكه أبو صلاح</div>
    <div class="status-badge" id="statusBadge">مفتوح الآن</div>
  </div>

  <div class="ticker-wrap">
    <div class="ticker" id="tickerText">أهلاً بكم في فواكه أبو صلاح • أطيب العصائر والكوكتيلات الطازجة • كفرسوسة</div>
  </div>

  <div class="container">
    <div class="categories-scroll" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCat('الكل', this)">الكل</button>
    </div>

    <div class="items-grid" id="itemsGrid">
      <p style="grid-column: 1/-1; text-align: center; color: #a4c2b2; padding: 30px;">جاري تحميل المنيو...</p>
    </div>
  </div>

  <div class="cart-bar" id="cartBar" style="display:none;" onclick="sendWhatsAppOrder()">
    <div>🛒 السلة (<span id="cartCount">0</span>) | <span id="cartTotal">0</span> ل.س</div>
    <div class="cart-btn-send">إرسال الطلب عبر الواتساب 💬</div>
  </div>

  <script>
    let rawData = { items: [] };
    let selectedCat = 'الكل';
    let cart = {};

    document.addEventListener("DOMContentLoaded", () => {
      // إجبار جلب أحدث نسخة بدون كاش عبر إضافة timestamp
      fetch(`data.json?v=${Date.now()}`)
        .then(res => res.json())
        .then(data => {
          rawData = data;
          initMenu();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('itemsGrid').innerHTML = '<p style="text-align:center; color:#e74c3c;">تعذر تحميل المنيو حالياً.</p>';
        });
    });

    function initMenu() {
      if(rawData.status_text) document.getElementById('statusBadge').innerText = rawData.status_text;
      if(rawData.ticker_text) document.getElementById('tickerText').innerText = rawData.ticker_text;

      // إستخراج التصنيفات
      const categories = ['الكل', ...new Set(rawData.items.map(i => i.category))];
      const catContainer = document.getElementById('categoriesContainer');
      catContainer.innerHTML = '';
      categories.forEach(cat => {
        catContainer.innerHTML += `<button class="cat-btn ${cat === selectedCat ? 'active' : ''}" onclick="filterCat('${cat}', this)">${cat}</button>`;
      });

      renderItems();
    }

    function filterCat(cat, btn) {
      selectedCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      const filtered = selectedCat === 'الكل' ? rawData.items : rawData.items.filter(i => i.category === selectedCat);

      if(filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #a4c2b2;">لا توجد أصناف متوفرة في هذا التصنيف.</p>';
        return;
      }

      filtered.forEach(item => {
        grid.innerHTML += `
          <div class="item-card">
            ${!item.available ? '<div class="unavailable-badge">غير متوفر</div>' : ''}
            <img src="${item.image}" class="item-img" onerror="this.src='https://via.placeholder.com/150'">
            <div class="item-info">
              <div>
                <div class="item-title">${item.name}</div>
                <div class="item-desc">${item.description || ''}</div>
              </div>
              <div>
                <div class="item-price">${item.price}</div>
                ${item.available ? `<button class="add-btn" onclick="addToCart(${item.id}, '${item.name}', '${item.price}')">+ إضافة للسلة</button>` : ''}
              </div>
            </div>
          </div>
        `;
      });
    }

    function addToCart(id, name, price) {
      if(cart[id]) {
        cart[id].qty++;
      } else {
        cart[id] = { name, price, qty: 1 };
      }
      updateCartUI();
    }

    function updateCartUI() {
      let count = 0;
      for(let key in cart) {
        count += cart[key].qty;
      }
      if(count > 0) {
        document.getElementById('cartBar').style.display = 'flex';
        document.getElementById('cartCount').innerText = count;
      } else {
        document.getElementById('cartBar').style.display = 'none';
      }
    }

    function sendWhatsAppOrder() {
      const waNum = rawData.whatsapp_number || "963900000000";
      let text = "أهلاً فواكه أبو صلاح، أرغب بطلب الآتي:\n\n";
      for(let key in cart) {
        text += `• ${cart[key].name} (${cart[key].qty}) - ${cart[key].price}\n`;
      }
      text += "\nالعنوان / التفاصيل:";
      
      const url = `https://wa.me/${waNum}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
