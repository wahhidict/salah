<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | فواكه أبو صلاح</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5b041;--gold2:#ffe4a8;--sub:#9fc0af;--bd:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:linear-gradient(160deg,#04160e,#082a1b 60%,#02100a);color:#fff;min-height:100vh;padding-bottom:60px}
.container{max-width:820px;margin:0 auto;padding:20px}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(3,16,10,.95),rgba(3,16,10,.8));backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:14px 20px}
.topbar-inner{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{font-size:1.15rem;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar a{background:var(--glass);border:1px solid var(--bd);color:var(--sub);text-decoration:none;padding:7px 13px;border-radius:10px;font-size:.78rem;font-weight:800}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:18px}
.card h2{font-size:1rem;color:var(--gold2);font-weight:900;margin-bottom:14px}
label{display:block;font-size:.76rem;color:var(--sub);font-weight:800;margin-bottom:6px}
input,textarea,select{width:100%;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:#fff;font-size:.9rem;outline:none;font-family:inherit;margin-bottom:12px}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:60px}
.btn{padding:10px 18px;border:none;border-radius:12px;cursor:pointer;font-weight:800;font-size:.88rem;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,var(--gold),#c98a1f);color:#061c11}
.btn-green{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.btn-blue{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff}
.btn-red{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.btn-sm{padding:6px 11px;font-size:.78rem;border-radius:9px}
.btn-full{width:100%}
.upload{background:rgba(245,176,65,.08);border:2px dashed rgba(245,176,65,.5);padding:16px;text-align:center;border-radius:14px;cursor:pointer;margin-bottom:12px;font-size:.88rem;font-weight:700;color:var(--gold2)}
.item{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.item-row{display:flex;gap:12px;align-items:center}
.item-row img{width:60px;height:60px;border-radius:12px;object-fit:cover;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-info .name{font-size:.95rem;font-weight:800;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-info .meta{font-size:.78rem;color:var(--gold2);font-weight:700}
.item-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;margin-top:8px}
.edit-form{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.edit-form.show{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;font-size:.88rem;z-index:999;opacity:0;transition:.35s;max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.size-info{font-size:.75rem;color:var(--sub);text-align:center;margin-top:8px}
.delivery-section{background:rgba(52,152,219,.06);border:1px solid rgba(52,152,219,.25);border-radius:14px;padding:14px;margin-top:8px}
.mode-pills{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mode-pills button{flex:1;min-width:100px;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);color:var(--sub);font-weight:800;font-size:.82rem;cursor:pointer;font-family:inherit}
.mode-pills button.active{background:linear-gradient(135deg,var(--gold),#c98a1f);color:#061c11;border-color:var(--gold)}
.qr-box{background:#fff;padding:20px;border-radius:14px;text-align:center;margin-bottom:12px}
.qr-box img{max-width:100%;width:260px;height:260px;display:block;margin:0 auto}
.qr-url{font-size:.72rem;color:var(--sub);margin-top:10px;word-break:break-all;text-align:center;background:rgba(0,0,0,.3);padding:8px;border-radius:8px}
.hide{display:none!important}
.info-box{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.35);border-radius:12px;padding:12px 14px;font-size:.78rem;color:#a9dfbf;margin-bottom:16px;line-height:1.6}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <h1>⚡ لوحة إدارة المنيو</h1>
    <a href="index.html" target="_blank">عرض الموقع ↗</a>
  </div>
</div>

<div class="container">

  <div class="info-box">
    ✅ متصل بـ <b>Firebase</b> — كل تعديل يُحفظ فورياً. مجاني للأبد.
  </div>

  <div class="card">
    <h2>🏪 الإعدادات العامة</h2>
    <label>رقم الواتساب (مع رمز الدولة):</label>
    <input type="text" id="waNum" placeholder="963xxxxxxxxx">
    <label>رقم الاتصال:</label>
    <input type="text" id="phoneNum" placeholder="011xxxxxxx">
    <label>حالة المحل:</label>
    <input type="text" id="statusTxt" placeholder="مفتوح الآن • توصيل لجميع مناطق دمشق">
    <label>نص الشريط المتحرك:</label>
    <input type="text" id="tickerTxt" placeholder="أهلاً بكم في فواكه أبو صلاح">
    <label>رابط موقع المحل (Google Maps):</label>
    <input type="text" id="locationUrl" placeholder="https://maps.app.goo.gl/...">
    <p style="font-size:.7rem;color:var(--sub);margin-top:-8px;margin-bottom:12px">افتح Google Maps → ابحث عن موقعك → انسخ الرابط والصقه هنا</p>
  </div>

  <div class="card">
    <h2>📱 رمز QR للمنيو</h2>
    <div class="qr-box"><img id="qrImg" src=""></div>
    <div class="qr-url" id="qrUrl">جاري التوليد...</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-blue" onclick="downloadQR()" style="flex:1">⬇️ تنزيل</button>
      <button class="btn btn-green" onclick="openMenuPage()" style="flex:1">🔗 فتح الموقع</button>
    </div>
  </div>

  <div class="card">
    <h2>🛵 إعدادات التوصيل</h2>
    <div class="delivery-section">
      <div class="mode-pills" id="modePills">
        <button data-mode="free">🎉 مجاني</button>
        <button data-mode="fixed">💰 سعر ثابت</button>
        <button data-mode="message">💬 رسالة</button>
      </div>
      <div id="fixedBlock" class="hide">
        <label>سعر التوصيل الثابت:</label>
        <input type="text" id="deliveryPrice" placeholder="مثال: 15000" inputmode="numeric">
      </div>
      <div id="messageBlock" class="hide">
        <label>نص رسالة التوصيل:</label>
        <textarea id="deliveryMessage" placeholder="قيمة التوصيل تُحدد حسب المنطقة"></textarea>
      </div>
    </div>
    <button class="btn btn-gold btn-full" id="saveSettingsBtn" onclick="saveSettings()" style="margin-top:14px">⚡ حفظ كل الإعدادات</button>
  </div>

  <div class="card">
    <h2>➕ إضافة صنف جديد</h2>
    <label>اسم الصنف *</label>
    <input type="text" id="nName" placeholder="مثال: كوكتيل امبراطور">
    <label>التصنيف *</label>
    <input type="text" id="nCat" placeholder="مثال: كوكتيلات" list="catsList">
    <datalist id="catsList"></datalist>
    <label>الوصف:</label>
    <input type="text" id="nDesc" placeholder="فواكه، قشطة، عسل، مكسرات">
    <label>السعر *</label>
    <input type="text" id="nPrice" placeholder="35,000 ل.س">
    <label>صورة الصنف *</label>
    <div class="upload" onclick="document.getElementById('nImg').click()">
      <span id="uploadText">📸 اضغط لاختيار صورة</span>
      <input type="file" id="nImg" accept="image/*" style="display:none" onchange="handleNewImage(this)">
    </div>
    <input type="hidden" id="nImgData">
    <button class="btn btn-green btn-full" id="addBtn" onclick="addItem()">⚡ إضافة ونشر</button>
  </div>

  <div class="card">
    <h2>📋 الأصناف الحالية</h2>
    <input type="text" id="filterItems" placeholder="🔍 ابحث..." oninput="renderItems()">
    <div id="itemsList">جاري التحميل...</div>
    <div class="size-info" id="sizeInfo"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const FIREBASE_URL = "https://alsalah-695f5-default-rtdb.europe-west1.firebasedatabase.app";
const API_URL = FIREBASE_URL + "/.json";

let appData = { items: [] };
let isSaving = false;
let currentMode = 'message';

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr = s => esc(s).replace(/"/g,'&quot;');

let toastT;
function toast(msg, err=false){
  const t = $('#toast');
  t.innerText = msg;
  t.className = 'toast' + (err ? ' err' : '');
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('show'), 3500);
}

function buildMenuUrl(){
  return window.location.href.split('?')[0].replace(/[^/]*$/,'') + 'index.html';
}
function initQR(){
  const url = buildMenuUrl();
  $('#qrUrl').innerText = url;
  $('#qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data=${encodeURIComponent(url)}`;
}
async function downloadQR(){
  const src = $('#qrImg').src;
  try{
    const r = await fetch(src);
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'menu-qr.png';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    toast('✅ تم التنزيل');
  }catch(e){ window.open(src, '_blank'); }
}
function openMenuPage(){ window.open(buildMenuUrl(), '_blank'); }

async function loadData(){
  try{
    const r = await fetch(`${API_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d){
      appData = {
        whatsapp_number: '', phone_number: '', status_text: 'مفتوح الآن',
        ticker_text: 'أهلاً بكم في فواكه أبو صلاح',
        delivery_mode: 'message', delivery_price: '0',
        delivery_message: '🛵 قيمة التوصيل تُحدد حسب المنطقة',
        location_url: '',
        items: []
      };
      fillForm(); renderItems(); return;
    }
    if(!Array.isArray(d.items)) d.items = [];
    appData = d;
    fillForm(); renderItems();
  }catch(e){
    $('#itemsList').innerHTML = '<p style="color:#e74c3c">تعذر الجلب: ' + e.message + '</p>';
  }
}

function fillForm(){
  $('#waNum').value     = appData.whatsapp_number || '';
  $('#phoneNum').value  = appData.phone_number    || '';
  $('#statusTxt').value = appData.status_text     || '';
  $('#tickerTxt').value = appData.ticker_text     || '';
  $('#locationUrl').value = appData.location_url   || '';
  $('#deliveryPrice').value   = appData.delivery_price   || '';
  $('#deliveryMessage').value = appData.delivery_message || '🛵 قيمة التوصيل تُحدد حسب المنطقة';
  setDeliveryMode(appData.delivery_mode || 'message');
}

function setDeliveryMode(mode){
  currentMode = mode;
  $$('#modePills button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  $('#fixedBlock').classList.toggle('hide', mode !== 'fixed');
  $('#messageBlock').classList.toggle('hide', mode !== 'message');
}
$$('#modePills button').forEach(b => b.onclick = () => setDeliveryMode(b.dataset.mode));

async function saveToServer(msg){
  if(isSaving){ toast('⏳ حفظ...'); return false; }
  isSaving = true;
  try{
    const r = await fetch(API_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(appData)
    });
    if(!r.ok){
      let err = 'فشل الحفظ (' + r.status + ')';
      if(r.status === 401 || r.status === 403) err = '⚠️ تحقق من Firebase Rules — يجب أن يكون write: true';
      throw new Error(err);
    }
    toast('✅ تم النشر بنجاح');
    return true;
  }catch(e){
    toast('❌ ' + e.message, true);
    return false;
  } finally { isSaving = false; }
}

function compress(file, maxDim=900, quality=.72){
  return new Promise((resolve, reject)=>{
    const rd = new FileReader();
    rd.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width:w, height:h } = img;
        if(w > maxDim || h > maxDim){
          const r = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        try { resolve(c.toDataURL('image/webp', quality)); }
        catch(_) { resolve(c.toDataURL('image/jpeg', quality)); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    rd.onerror = reject;
    rd.readAsDataURL(file);
  });
}

async function handleNewImage(input){
  const f = input.files[0];
  if(!f) return;
  $('#uploadText').innerText = '⏳ جاري الضغط...';
  try{
    const d = await compress(f);
    $('#nImgData').value = d;
    $('#uploadText').innerText = '✅ جاهزة (' + Math.round(d.length/1024) + ' KB)';
  }catch(e){ $('#uploadText').innerText = '❌ فشل'; }
}

async function addItem(){
  const name  = $('#nName').value.trim();
  const cat   = $('#nCat').value.trim();
  const desc  = $('#nDesc').value.trim();
  const price = $('#nPrice').value.trim();
  const img   = $('#nImgData').value;

  if(!name || !cat || !price) return toast('أدخل الاسم والتصنيف والسعر', true);
  if(!img) return toast('اختر صورة', true);

  appData.items.push({ id: Date.now(), name, category: cat, description: desc, price, available: true, featured: false, image: img });

  const b = $('#addBtn');
  b.disabled = true; b.innerText = '⏳ نشر...';
  const ok = await saveToServer('إضافة: ' + name);
  b.disabled = false; b.innerText = '⚡ إضافة ونشر';

  if(ok){
    renderItems();
    ['nName','nCat','nDesc','nPrice','nImgData'].forEach(id => $('#'+id).value = '');
    $('#nImg').value = '';
    $('#uploadText').innerText = '📸 اضغط لاختيار صورة';
  }
}

function renderItems(){
  const q = ($('#filterItems').value || '').trim().toLowerCase();
  const list = appData.items.map((it,i)=>({it,i})).filter(({it})=>{
    if(!q) return true;
    return (it.name||'').toLowerCase().includes(q) || (it.category||'').toLowerCase().includes(q);
  });

  if(!list.length){
    $('#itemsList').innerHTML = '<p style="color:var(--sub);text-align:center;padding:20px">لا توجد أصناف</p>';
  } else {
    $('#itemsList').innerHTML = list.map(({it,i})=>`
      <div class="item">
        <div class="item-row">
          <img src="${escAttr(it.image)}" onerror="this.src='https://placehold.co/60/0a2b1a/f5b041?text=%D8%B5%D9%88%D8%B1%D8%A9'">
          <div class="item-info">
            <div class="name">${esc(it.name)} ${it.featured?'⭐':''}</div>
            <div class="meta">${esc(it.price)} • ${esc(it.category)}</div>
          </div>
        </div>
        <div class="item-actions">
          <button class="btn btn-sm btn-blue" onclick="toggleEdit(${i})">تعديل ✏️</button>
          <button class="btn btn-sm ${it.available?'btn-green':''}" style="${it.available?'':'background:rgba(255,255,255,.1);color:#fff'}" onclick="toggleAvail(${i})">${it.available?'متوفر ✓':'نفذ ✗'}</button>
          <button class="btn btn-sm ${it.featured?'btn-gold':''}" style="${it.featured?'':'background:rgba(255,255,255,.1);color:#fff'}" onclick="toggleFeatured(${i})">${it.featured?'⭐ مميز':'☆ تمييز'}</button>
          <button class="btn btn-sm btn-red" onclick="delItem(${i})">حذف 🗑️</button>
        </div>
        <div class="edit-form" id="ef_${i}">
          <label>الاسم:</label><input type="text" id="eName_${i}" value="${escAttr(it.name)}">
          <label>التصنيف:</label><input type="text" id="eCat_${i}" value="${escAttr(it.category)}" list="catsList">
          <label>الوصف:</label><input type="text" id="eDesc_${i}" value="${escAttr(it.description||'')}">
          <label>السعر:</label><input type="text" id="ePrice_${i}" value="${escAttr(it.price)}">
          <label>تغيير الصورة:</label><input type="file" accept="image/*" onchange="handleEditImage(this, ${i})">
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-green btn-sm" onclick="saveEdit(${i})">حفظ ✅</button>
            <button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="toggleEdit(${i})">إلغاء</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  const cats = [...new Set(appData.items.map(i=>i.category).filter(Boolean))];
  $('#catsList').innerHTML = cats.map(c=>`<option value="${escAttr(c)}">`).join('');

  const kb = Math.round(JSON.stringify(appData).length / 1024);
  $('#sizeInfo').innerText = `حجم البيانات: ${kb} KB — عدد الأصناف: ${appData.items.length}`;
}

function toggleEdit(i){ $('#ef_'+i).classList.toggle('show'); }

async function handleEditImage(input, i){
  const f = input.files[0];
  if(!f) return;
  try{
    const d = await compress(f);
    appData.items[i].image = d;
    toast('✅ اضغط حفظ');
  }catch(e){ toast('فشل', true); }
}
async function saveEdit(i){
  appData.items[i].name        = $('#eName_'+i).value.trim();
  appData.items[i].category    = $('#eCat_'+i).value.trim();
  appData.items[i].description = $('#eDesc_'+i).value.trim();
  appData.items[i].price       = $('#ePrice_'+i).value.trim();
  const ok = await saveToServer('تعديل');
  if(ok) renderItems();
}
async function toggleAvail(i){
  appData.items[i].available = !appData.items[i].available;
  const ok = await saveToServer('حالة');
  if(ok) renderItems();
}
async function toggleFeatured(i){
  appData.items[i].featured = !appData.items[i].featured;
  const ok = await saveToServer('تمييز');
  if(ok) renderItems();
}
async function delItem(i){
  if(!confirm('حذف "' + appData.items[i].name + '"؟')) return;
  appData.items.splice(i,1);
  const ok = await saveToServer('حذف');
  if(ok) renderItems();
}

async function saveSettings(){
  appData.whatsapp_number = $('#waNum').value.trim();
  appData.phone_number    = $('#phoneNum').value.trim();
  appData.status_text     = $('#statusTxt').value.trim();
  appData.ticker_text     = $('#tickerTxt').value.trim();
  appData.location_url    = $('#locationUrl').value.trim();
  appData.delivery_mode   = currentMode;
  appData.delivery_price  = $('#deliveryPrice').value.trim() || '0';
  appData.delivery_message = $('#deliveryMessage').value.trim() || '🛵 قيمة التوصيل تُحدد حسب المنطقة';

  const b = $('#saveSettingsBtn');
  b.disabled = true; b.innerText = '⏳ نشر...';
  await saveToServer('تحديث الإعدادات');
  b.disabled = false; b.innerText = '⚡ حفظ كل الإعدادات';
}

document.addEventListener('DOMContentLoaded', () => {
  initQR();
  loadData();
});
</script>
</body>
</html>
