<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فواكه أبو صلاح | المنيو الفاخر</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #03120b 0%, #08281a 50%, #020b07 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(15, 41, 28, 0.55);
      --accent-gold: #f39c12;
      --accent-gold-light: #ffe082;
      --accent-green: #2ecc71;
      --text-main: #ffffff;
      --text-sub: #a4c2b2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; padding-bottom: 120px; }

    .header { background: rgba(3, 18, 11, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; padding: 16px; text-align: center; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
    .brand-title { font-size: 1.8rem; font-weight: 900; background: linear-gradient(45deg, #f39c12, #ffe082); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(46, 204, 113, 0.15); color: var(--accent-green); border: 1px solid rgba(46, 204, 113, 0.4); padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; margin-top: 6px; }
    .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }
    .status-dot.closed { background: #e74c3c; box-shadow: 0 0 10px #e74c3c; }

    .ticker-wrap { background: rgba(243, 156, 18, 0.15); border-top: 1px solid rgba(243, 156, 18, 0.3); border-bottom: 1px solid rgba(243, 156, 18, 0.3); color: var(--accent-gold-light); font-weight: 700; font-size: 0.85rem; padding: 8px 0; overflow: hidden; white-space: nowrap; backdrop-filter: blur(5px); }
    .ticker { display: inline-block; animation: marquee 22s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    .main-container { padding: 16px; max-width: 750px; margin: 0 auto; }
    .search-box { margin-bottom: 16px; }
    .search-input { width: 100%; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px 18px; border-radius: 16px; color: #fff; font-size: 0.95rem; backdrop-filter: blur(10px); outline: none; transition: 0.3s; }
    .search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(243, 156, 18, 0.2); }
    .search-input::placeholder { color: var(--text-sub); }

    .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .cat-pill { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-sub); padding: 10px 20px; border-radius: 25px; font-weight: 800; font-size: 0.9rem; white-space: nowrap; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease; }
    .cat-pill.active { background: linear-gradient(135deg, #f39c12, #d35400); color: #000; border-color: #f39c12; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.35); }

    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .item-card { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); transition: transform 0.25s, box-shadow 0.25s; position: relative; }
    .item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .img-container { position: relative; width: 100%; height: 140px; overflow: hidden; background: #081a11; }
    .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .item-card:hover .item-img { transform: scale(1.06); }
    .unavail-tag { position: absolute; top: 10px; right: 10px; background: rgba(198, 40, 40, 0.85); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 800; backdrop-filter: blur(5px); }
    .item-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .item-desc { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-price { font-size: 0.98rem; font-weight: 900; color: var(--accent-gold-light); margin-bottom: 8px; }
    .add-cart-btn { background: rgba(243, 156, 18, 0.15); color: var(--accent-gold-light); border: 1px solid rgba(243, 156, 18, 0.4); width: 100%; padding: 9px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .add-cart-btn:active { background: var(--accent-gold); color: #000; }
    .qty-controls { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 3px; }
    .qty-btn { background: var(--accent-gold); color: #000; border: none; width: 28px; height: 28px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    .qty-num { font-weight: 800; font-size: 0.9rem; color: #fff; }

    .cart-float-bar { position: fixed; bottom: 20px; left: 16px; right: 16px; max-width: 718px; margin: 0 auto; background: rgba(39, 174, 96, 0.9); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: white; padding: 14px 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 99; cursor: pointer; transition: transform 0.2s; }
    .cart-float-bar:active { transform: scale(0.98); }
    .cart-send-btn { background: #fff; color: #1e8449; padding: 8px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 900; }

    .loader-box { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub); }

    /* شارة تحديث صغيرة */
    #refreshBadge {
      position: fixed; top: 12px; left: 12px;
      background: rgba(46, 204, 113, 0.95); color: #fff;
      padding: 6px 12px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 800;
      opacity: 0; transition: opacity 0.5s;
      z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-title">🍓 فواكه أبو صلاح</div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">جاري التحميل...</span>
    </div>
  </header>

  <div class="ticker-wrap">
    <div class="ticker" id="tickerText">أهلاً بكم في فواكه أبو صلاح • كفرسوسة</div>
  </div>

  <main class="main-container">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن صنف أو عصير...">
    </div>

    <div class="categories-scroll" id="categoriesBox">
      <button class="cat-pill active">الكل</button>
    </div>

    <div class="items-grid" id="itemsGrid">
      <div class="loader-box">جاري تحميل المنيو اللحظي...⚡</div>
    </div>
  </main>

  <div class="cart-float-bar" id="cartBar" style="display: none;" onclick="sendWhatsAppOrder()">
    <div>
      <span style="font-size:1.1rem;">🛒 السلة:</span> 
      <strong id="cartCount">0</strong> صنف
    </div>
    <div class="cart-send-btn">طلب عبر الواتساب 💬</div>
  </div>

  <div id="refreshBadge">✨ تم تحديث المنيو</div>

  <script>
    /* ============ الإعدادات ============ */
    const GITHUB_OWNER  = "wahhidict";
    const GITHUB_REPO   = "salah";
    const GITHUB_BRANCH = "main";  // ← غيّرها إلى "master" إذا كان الفرع مختلفاً
    const FILE_PATH     = "data.json";
    const COMMIT_POLL_MS = 90000;  // فحص كل 90 ثانية
    const FALLBACK_IMG = "https://placehold.co/300x200/0a2b1a/f39c12?text=%D9%81%D9%88%D8%A7%D9%83%D9%87";

    /* ============ الحالة ============ */
    let rawData = { items: [] };
    let activeCategory = 'الكل';
    let cart = {};
    let searchTimer = null;
    let lastCommitSha = null;
    let firstLoad = true;

    document.addEventListener("DOMContentLoaded", () => {
      fetchMenuData();
      // فحص دوري خفيف جداً لتغيّر آخر commit
      setInterval(checkForUpdate, COMMIT_POLL_MS);
      // عند عودة التبويب للنشاط، افحص فوراً
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) checkForUpdate();
      });
      // بحث بتأخير خفيف
      document.getElementById('searchInput').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderItems, 160);
      });
    });

    /* ============ أدوات ============ */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
      ));
    }

    /* ============ جلب البيانات (متعدد المصادر) ============ */
    async function fetchMenuData() {
      const ts = Date.now();
      const sources = [
        // 1) GitHub API - لا يوجد كاش إطلاقاً
        {
          url: `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}?ref=${GITHUB_BRANCH}&t=${ts}`,
          headers: { 'Accept': 'application/vnd.github.v3.raw' }
        },
        // 2) jsDelivr
        { url: `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${FILE_PATH}?t=${ts}` },
        // 3) raw.githubusercontent
        { url: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${FILE_PATH}?t=${ts}` },
        // 4) نسبي
        { url: `./${FILE_PATH}?t=${ts}` }
      ];

      for (const src of sources) {
        try {
          const res = await fetch(src.url, {
            headers: src.headers || {},
            cache: 'no-store'
          });
          if (!res.ok) continue;
          const data = await res.json();
          if (!data || !Array.isArray(data.items)) continue;

          const signature = (data.items || [])
            .map(i => i.id + '|' + i.price + '|' + i.available)
            .join('~') + '#' + (data.status_text || '');

          const changed = signature !== window.__lastSig;
          window.__lastSig = signature;

          rawData = data;
          initMenu();
          if (!firstLoad && changed) showRefreshBadge();
          firstLoad = false;
          return;
        } catch (e) { /* جرّب المصدر التالي */ }
      }

      if (firstLoad) {
        document.getElementById('itemsGrid').innerHTML =
          '<div class="loader-box" style="color:#e74c3c;">تعذر تحميل المنيو حالياً. يرجى إعادة تحديث الصفحة.</div>';
      }
    }

    /* ============ فحص خفيف لتغيّر الملف ============ */
    async function checkForUpdate() {
      if (document.hidden) return;
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?path=${FILE_PATH}&per_page=1&t=${Date.now()}`,
          { headers: { 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' }
        );
        if (!res.ok) return;
        const commits = await res.json();
        if (!Array.isArray(commits) || !commits.length) return;
        const sha = commits[0].sha;
        if (lastCommitSha && sha !== lastCommitSha) {
          await fetchMenuData();
        }
        lastCommitSha = sha;
      } catch (e) { /* تجاهل */ }
    }

    /* ============ تهيئة الواجهة ============ */
    function initMenu() {
      if (rawData.status_text) {
        document.getElementById('statusText').innerText = rawData.status_text;
        const closed = /مغلق|مقفل|مغلق الآن|closed/i.test(rawData.status_text);
        document.getElementById('statusDot').classList.toggle('closed', closed);
      }
      if (rawData.ticker_text) {
        document.getElementById('tickerText').innerText = rawData.ticker_text;
      }

      const cats = ['الكل', ...new Set((rawData.items || []).map(i => i.category).filter(Boolean))];
      if (!cats.includes(activeCategory)) activeCategory = 'الكل';

      const catBox = document.getElementById('categoriesBox');
      const catHtml = cats.map(cat =>
        `<button class="cat-pill ${cat === activeCategory ? 'active' : ''}" data-cat="${esc(cat)}">${esc(cat)}</button>`
      ).join('');
      catBox.innerHTML = catHtml;
      catBox.querySelectorAll('.cat-pill').forEach(btn => {
        btn.onclick = () => selectCategory(btn.dataset.cat);
      });

      renderItems();
    }

    function selectCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === cat);
      });
      renderItems();
    }

    /* ============ عرض الأصناف ============ */
    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      const filtered = (rawData.items || []).filter(item => {
        const matchCat = activeCategory === 'الكل' || item.category === activeCategory;
        const nameL = (item.name || '').toLowerCase();
        const descL = (item.description || '').toLowerCase();
        const matchSearch = !query || nameL.includes(query) || descL.includes(query);
        return matchCat && matchSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="loader-box">لا توجد نتائج مطابقة.</div>';
        return;
      }

      const html = filtered.map(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;
        const img = item.image ? esc(item.image) : FALLBACK_IMG;
        return `
          <div class="item-card">
            <div class="img-container">
              <img src="${img}" class="item-img" loading="lazy"
                   onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
              ${!item.available ? '<div class="unavail-tag">غير متوفر</div>' : ''}
            </div>
            <div class="item-details">
              <div>
                <div class="item-title">${esc(item.name)}</div>
                <div class="item-desc">${esc(item.description)}</div>
              </div>
              <div>
                <div class="item-price">${esc(item.price)}</div>
                ${item.available ? (
                  qty > 0
                    ? `<div class="qty-controls">
                         <button class="qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
                         <span class="qty-num">${qty}</span>
                         <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                       </div>`
                    : `<button class="add-cart-btn" onclick="updateQty(${item.id}, 1)">+ إضافة للسلة</button>`
                ) : ''}
              </div>
            </div>
          </div>`;
      }).join('');

      grid.innerHTML = html;
    }

    /* ============ السلة ============ */
    function updateQty(id, delta) {
      const item = (rawData.items || []).find(i => i.id === id);
      if (!item) return;
      if (!cart[id]) cart[id] = { name: item.name, price: item.price, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      updateCartBarUI();
      renderItems();
    }

    function updateCartBarUI() {
      let total = 0;
      for (const id in cart) total += cart[id].qty;
      const bar = document.getElementById('cartBar');
      if (total > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartCount').innerText = total;
      } else {
        bar.style.display = 'none';
      }
    }

    function sendWhatsAppOrder() {
      const waNum = rawData.whatsapp_number || "963900000000";
      let text = "🍓 *طلب جديد من المنيو الإلكتروني - فواكه أبو صلاح*:\n\n";
      for (const id in cart) {
        text += `• *${cart[id].name}* × ${cart[id].qty}  (${cart[id].price})\n`;
      }
      text += "\n📍 *الاسم والعنوان*: ";
      window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function showRefreshBadge() {
      const b = document.getElementById('refreshBadge');
      b.style.opacity = '1';
      setTimeout(() => { b.style.opacity = '0'; }, 2600);
    }
  </script>
</body>
</html>
