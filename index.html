<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>فواكه أبو صلاح | الفخامة في كل قطرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--black:#050505;--black-2:#0d0d0d;--black-3:#141414;--gold:#c9a227;--gold-2:#e6c45c;--gold-3:#8b6914;--gold-glow:rgba(201,162,39,.25);--green:#1a3a2a;--green-2:#2d5a3d;--green-accent:#4ade80;--orange:#e67e22;--orange-2:#f39c12;--txt:#f5f0e8;--txt-sub:#a89f8e;--glass:rgba(255,255,255,.03);--glass-2:rgba(255,255,255,.06);--bd:rgba(201,162,39,.15);--bd-2:rgba(201,162,39,.3);--card:rgba(13,13,13,.85);--shadow:0 20px 60px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--black);color:var(--txt);min-height:100vh;padding-bottom:160px;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(ellipse 800px 400px at 50% -10%,rgba(201,162,39,.06),transparent 70%),radial-gradient(ellipse 600px 300px at 100% 110%,rgba(26,58,42,.15),transparent 70%)}
body>*:not(.overlay):not(.cart-panel):not(.modal):not(.toast):not(.refresh){position:relative;z-index:1}
.hdr{position:sticky;top:0;z-index:80;background:linear-gradient(180deg,rgba(5,5,5,.97),rgba(5,5,5,.85));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:14px 16px 12px;box-shadow:0 4px 30px rgba(0,0,0,.5)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:900px;margin:0 auto;flex-wrap:wrap}
.brand-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.brand-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold-3));display:grid;place-items:center;font-size:1.2rem;box-shadow:0 0 20px var(--gold-glow);border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.brand{font-family:'Amiri',serif;font-size:1.25rem;font-weight:700;line-height:1.15;background:linear-gradient(135deg,var(--gold-2),var(--gold),var(--gold-3));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand small{display:block;font-family:'Tajawal',sans-serif;font-size:.58rem;font-weight:500;color:var(--txt-sub);-webkit-text-fill-color:var(--txt-sub);letter-spacing:1.5px;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--bd);color:var(--gold-2);display:grid;place-items:center;cursor:pointer;font-size:1rem;transition:.2s;flex-shrink:0;text-decoration:none}
.icon-btn:active{transform:scale(.9)}
.icon-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.map-btn{color:#4ade80}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);color:var(--green-accent);font-size:.72rem;font-weight:800;white-space:nowrap}
.status-pill.closed{background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.3);color:#e74c3c}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:pulse 1.8s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

@media(max-width:560px){
  .hdr-right{flex-basis:100%;justify-content:space-between;gap:6px;margin-top:2px}
  .status-pill{flex:1;justify-content:center;padding:8px 10px;font-size:.7rem;order:1;max-width:none;min-width:0}
  .icon-btn{width:36px;height:36px;font-size:.95rem}
  .brand{font-size:1.15rem}
  .brand-icon{width:38px;height:38px;font-size:1.1rem}
  .brand small{font-size:.55rem;letter-spacing:1px}
}

.ticker-wrap{background:linear-gradient(90deg,transparent,rgba(201,162,39,.08),transparent);border-bottom:1px solid rgba(201,162,39,.12);color:var(--gold-2);font-weight:600;font-size:.78rem;padding:10px 0;overflow:hidden;white-space:nowrap}
.ticker{display:inline-block;padding-inline-start:100%;animation:marquee 30s linear infinite}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px}
.search{position:relative;margin-bottom:20px}
.search svg{position:absolute;top:50%;right:16px;transform:translateY(-50%);opacity:.35;color:var(--gold)}
.search input{width:100%;padding:15px 48px 15px 18px;background:var(--glass);border:1px solid var(--bd);border-radius:16px;color:var(--txt);font-size:.9rem;outline:none;font-family:'Tajawal',sans-serif}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow)}
.cats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:20px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:10px 22px;border-radius:100px;white-space:nowrap;cursor:pointer;background:transparent;border:1px solid var(--bd);color:var(--txt-sub);font-weight:700;font-size:.82rem;transition:.3s;font-family:'Tajawal',sans-serif}
.cat.active{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);border-color:var(--gold);font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;position:relative}
.card:active{transform:scale(.97)}
.card-img{position:relative;width:100%;aspect-ratio:1/.9;overflow:hidden;background:var(--black-2)}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,5,5,.85) 100%)}
.card-img .featured{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;padding:4px 12px;border-radius:100px;font-size:.65rem;font-weight:900;z-index:2}
.card-img .badge{position:absolute;top:10px;left:10px;background:rgba(5,5,5,.85);color:#e74c3c;padding:4px 10px;border-radius:100px;font-size:.65rem;font-weight:900;z-index:2}
.card-body{padding:13px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-size:.92rem;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.card-desc{font-size:.72rem;color:var(--txt-sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2em}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid rgba(201,162,39,.08)}
.price{font-size:.92rem;font-weight:900;color:var(--gold-2)}
.add-btn{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff;border:none;width:36px;height:36px;border-radius:12px;font-size:1.2rem;font-weight:900;cursor:pointer;display:grid;place-items:center}
.qty-mini{display:flex;align-items:center;gap:5px;background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.25);border-radius:12px;padding:2px}
.qty-mini button{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);border:none;width:28px;height:28px;border-radius:9px;font-weight:900;font-size:1rem;cursor:pointer;display:grid;place-items:center}
.qty-mini span{font-weight:900;font-size:.85rem;min-width:18px;text-align:center;color:var(--gold-2)}
.cart-bar{position:fixed!important;bottom:0!important;left:0!important;right:0!important;max-width:900px;margin:0 auto;background:linear-gradient(135deg,var(--green),#0f2419);border-top:1px solid rgba(201,162,39,.4);color:#fff;padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -10px 40px rgba(0,0,0,.7);z-index:9999;cursor:pointer}
.cart-bar.empty{background:linear-gradient(135deg,#132b1e,#081810)}
.cart-bar-left{display:flex;align-items:center;gap:10px;font-weight:800}
.cart-bar-left .cnt{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);border-radius:10px;padding:3px 12px;font-size:.85rem;font-weight:900;min-width:32px;text-align:center}
.cart-bar-right{display:flex;align-items:center;gap:10px;margin-inline-start:auto}
.cart-bar-right .total{font-size:1rem;font-weight:900;color:var(--gold-2);white-space:nowrap}
.cart-bar-right .go{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);padding:10px 18px;border-radius:12px;font-weight:900;font-size:.85rem;white-space:nowrap}
.cart-bar.empty .cart-bar-right .total{display:none}
.cart-bar.empty .cart-bar-right .go{background:rgba(255,255,255,.12);color:var(--gold-2);border:1px solid rgba(201,162,39,.3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);opacity:0;pointer-events:none;transition:.35s;z-index:10000}
.overlay.show{opacity:1;pointer-events:auto}
.cart-panel{position:fixed;inset:auto 0 0 0;height:92vh;z-index:10001;background:linear-gradient(180deg,var(--black-2),var(--black));border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid var(--bd-2);transform:translateY(100%);transition:transform .4s cubic-bezier(.25,.9,.3,1);display:flex;flex-direction:column;overflow:hidden}
.cart-panel.show{transform:translateY(0)}
@media(min-width:760px){.cart-panel{inset:0 0 0 auto;width:480px;height:100vh;border-radius:0;transform:translateX(110%)}.cart-panel.show{transform:translateX(0)}}
.panel-hdr{flex-shrink:0;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);background:rgba(5,5,5,.9)}
.panel-hdr h2{font-family:'Amiri',serif;font-size:1.15rem;font-weight:700;color:var(--gold-2);display:flex;align-items:center;gap:8px}
.close-x{background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#e74c3c;width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:1.2rem;font-weight:900;display:grid;place-items:center}
.panel-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
.panel-summary{padding:12px 22px;background:linear-gradient(90deg,rgba(201,162,39,.12),rgba(201,162,39,.04));border-bottom:1px solid rgba(201,162,39,.25);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.88rem;color:var(--gold-2);position:sticky;top:0;z-index:3}
.panel-summary .s-count{display:flex;align-items:center;gap:8px}
.panel-summary .s-count strong{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);padding:2px 10px;border-radius:8px;font-size:.85rem}
.panel-summary .s-total{font-size:1.05rem;color:#fff;font-weight:900}
.panel-body{padding:16px 20px 8px}
.cart-item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--glass);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px}
.cart-item img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0}
.cart-item .info{flex:1;min-width:0}
.cart-item .name{font-weight:800;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-item .p{font-size:.78rem;color:var(--gold-2);font-weight:800;margin-top:3px}
.cart-item .line-total{font-size:.72rem;color:var(--txt-sub);margin-top:2px}
.cart-item .qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cart-item .qty button{width:30px;height:30px;border-radius:9px;border:none;cursor:pointer;background:var(--glass-2);color:var(--txt);font-weight:900;font-size:1rem;display:grid;place-items:center}
.cart-item .qty button.plus{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black)}
.cart-item .qty span{font-weight:900;min-width:22px;text-align:center}
.empty-cart{text-align:center;padding:60px 20px;color:var(--txt-sub)}
.empty-cart .ico{font-size:3.5rem;opacity:.3;margin-bottom:14px}
.form-sec{padding:16px 22px 20px;border-top:1px solid var(--bd);background:rgba(5,5,5,.4)}
.form-sec h3{font-family:'Amiri',serif;font-size:1rem;font-weight:700;color:var(--gold-2);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.72rem;color:var(--txt-sub);font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--bd);color:var(--txt);font-size:.88rem;outline:none;font-family:'Tajawal',sans-serif}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:none;min-height:60px}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-toggle button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--txt-sub);font-weight:800;font-size:.82rem;cursor:pointer;font-family:'Tajawal',sans-serif}
.type-toggle button.active{background:linear-gradient(135deg,var(--gold-2),var(--gold-3));color:var(--black);border-color:var(--gold)}
.delivery-info{background:linear-gradient(135deg,rgba(230,126,34,.12),rgba(230,126,34,.04));border:1px solid rgba(230,126,34,.25);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:.82rem;color:#f0b27a;line-height:1.6;display:flex;gap:10px}
.delivery-info.free{background:linear-gradient(135deg,rgba(74,222,128,.1),rgba(74,222,128,.03));border-color:rgba(74,222,128,.3);color:#a9dfbf}
.delivery-info.fixed{background:linear-gradient(135deg,var(--gold-glow),rgba(201,162,39,.05));border-color:var(--bd-2);color:var(--gold-2)}
.panel-footer{flex-shrink:0;padding:14px 22px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(13,13,13,.95),#050505);border-top:1px solid var(--bd-2)}
.footer-totals{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.85rem;color:var(--txt-sub);font-weight:700}
.footer-totals .sub-row{display:flex;justify-content:space-between;width:100%}
.footer-totals .grand{font-size:1.05rem;color:#fff;font-weight:900;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(201,162,39,.25)}
.footer-totals .grand .val{color:var(--gold-2);font-size:1.15rem}
.send-btn{width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:900;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Tajawal',sans-serif}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;padding:14px 24px;border-radius:14px;font-weight:800;font-size:.85rem;z-index:20000;opacity:0;transition:.4s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:linear-gradient(135deg,#c0392b,#8b1a1a)}
.loader{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--txt-sub)}
.spinner{width:44px;height:44px;margin:0 auto 16px;border:2px solid rgba(201,162,39,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
.refresh{position:fixed;top:16px;left:16px;background:linear-gradient(135deg,#2d5a3d,#1a3a2a);color:#fff;padding:8px 16px;border-radius:12px;font-size:.72rem;font-weight:800;opacity:0;transition:opacity .5s;z-index:15000;pointer-events:none}
.refresh.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:12000;padding:16px}
.modal.show{display:grid}
.modal-inner{background:linear-gradient(180deg,var(--black-3),var(--black));border:1px solid var(--bd-2);border-radius:26px;max-width:420px;width:100%;max-height:90vh;overflow:auto;position:relative}
.modal-inner img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:26px 26px 0 0}
.modal-body{padding:22px}
.modal-body h3{font-family:'Amiri',serif;font-size:1.3rem;font-weight:700;margin-bottom:8px;color:var(--gold-2)}
.modal-body .md-desc{font-size:.85rem;color:var(--txt-sub);line-height:1.6;margin-bottom:16px}
.modal-body .md-price{font-size:1.3rem;font-weight:900;color:var(--gold-2);margin-bottom:18px}
.hide{display:none!important}
.modal-close{position:absolute;top:14px;left:14px;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(201,162,39,.5);color:#fff;font-size:1.3rem;font-weight:900;display:grid;place-items:center;cursor:pointer}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="brand-wrap">
      <div class="brand-icon">🍓</div>
      <div>
        <div class="brand">فواكه أبو صلاح</div>
        <small>كفرسوسة — دمشق</small>
      </div>
    </div>
    <div class="hdr-right">
      <div class="status-pill" id="statusPill">
        <span class="dot"></span><span id="statusText">جاري التحميل...</span>
      </div>
      <a class="icon-btn map-btn" id="mapBtn" onclick="openLocation()" title="موقعنا">📍</a>
      <button class="icon-btn" id="refreshBtn" onclick="forceRefresh()" title="تحديث">🔄</button>
    </div>
  </div>
</header>

<div class="ticker-wrap">
  <div class="ticker" id="tickerText">أهلاً بكم في فواكه أبو صلاح</div>
</div>

<main class="wrap">
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="text" id="searchInput" placeholder="ابحث عن كوكتيل أو عصير...">
  </div>
  <div class="cats" id="catsBox"></div>
  <div class="grid" id="grid"><div class="loader"><div class="spinner"></div>جاري تحميل المنيو...</div></div>
</main>

<div class="cart-bar empty" id="cartBar" onclick="openCart()">
  <div class="cart-bar-left">
    <span class="icon">🛒</span>
    <span class="cnt" id="cartCnt">0</span>
    <span class="lbl" id="cartLbl">ابدأ الطلب</span>
  </div>
  <div class="cart-bar-right">
    <span class="total" id="cartTotal">0 ل.س</span>
    <span class="go" id="cartGo">اختر أصنافك</span>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>

<aside class="cart-panel" id="cartPanel">
  <div class="panel-hdr">
    <h2>🛒 سلة الطلبات</h2>
    <button class="close-x" onclick="closeCart()">✕</button>
  </div>
  <div class="panel-scroll">
    <div class="panel-summary">
      <div class="s-count"><strong id="panelCount">0</strong> صنف مختار</div>
      <div class="s-total" id="panelTotal">0 ل.س</div>
    </div>
    <div class="panel-body" id="cartItems">
      <div class="empty-cart"><div class="ico">🛒</div><p>السلة فارغة</p></div>
    </div>
    <div class="form-sec" id="orderForm" style="display:none">
      <h3>📝 تفاصيل الطلب</h3>
      <div class="type-toggle" id="typeToggle">
        <button data-type="delivery" class="active">🛵 توصيل</button>
        <button data-type="dinein">🍽️ بالطاولة</button>
      </div>
      <div id="deliveryBox"></div>
      <div class="field">
        <label>الاسم *</label>
        <input type="text" id="fName" placeholder="اسمك الكريم">
      </div>
      <div class="field" id="phoneField">
        <label>رقم الهاتف *</label>
        <input type="tel" id="fPhone" placeholder="09xxxxxxxx" inputmode="tel">
      </div>
      <div class="field" id="addrField">
        <label>العنوان التفصيلي *</label>
        <textarea id="fAddr" placeholder="المنطقة، الشارع، رقم البناء..."></textarea>
      </div>
      <div class="field hide" id="tableField">
        <label>رقم الطاولة *</label>
        <input type="text" id="fTable" placeholder="مثال: 5" inputmode="numeric">
      </div>
      <div class="field">
        <label>ملاحظات (اختياري)</label>
        <textarea id="fNotes" placeholder="بدون سكر، زيادة قشطة..."></textarea>
      </div>
    </div>
  </div>
  <div class="panel-footer" id="panelFooter" style="display:none">
    <div class="footer-totals">
      <div style="width:100%">
        <div class="sub-row" id="subtotalRow"><span>المجموع الفرعي</span><span id="sumSubtotal">0 ل.س</span></div>
        <div class="sub-row hide" id="deliveryRow"><span>🛵 التوصيل</span><span id="sumDelivery">0 ل.س</span></div>
        <div class="sub-row grand"><span>الإجمالي</span><span class="val" id="sumTotal">0 ل.س</span></div>
      </div>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendOrder()">إرسال الطلب على واتساب</button>
  </div>
</aside>

<div class="modal" id="itemModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-inner" id="modalInner"></div>
</div>

<div class="toast" id="toast"></div>
<div class="refresh" id="refreshBadge">✨ تم تحديث المنيو</div>

<script>
const FIREBASE_URL = "https://alsalah-695f5-default-rtdb.europe-west1.firebasedatabase.app";
const API_URL = FIREBASE_URL + "/.json";
const POLL_MS = 60000;
const FALLBACK_IMG = "https://placehold.co/400x400/0d0d0d/c9a227?text=%D8%B5%D9%88%D8%B1%D8%A9";
const DEFAULT_LOCATION = "https://maps.app.goo.gl/ELfQSgsabBak2jx69";

let rawData = { items: [] };
let activeCat = 'الكل';
let cart = {};
let orderType = 'delivery';
let firstLoad = true;
let lastSig = null;
let searchTimer = null;

const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = s => parseFloat(String(s||'').replace(/[^\d.]/g,'')) || 0;
const fmt = n => n.toLocaleString('en-US') + ' ل.س';

function toast(msg, err=false){
  const t = $('#toast');
  t.innerText = msg;
  t.className = 'toast' + (err ? ' err' : '');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2800);
}

function openLocation(){
  const url = (rawData.location_url && rawData.location_url.trim()) || DEFAULT_LOCATION;
  window.open(url, '_blank');
}

async function loadData(isManual=false){
  try{
    const r = await fetch(`${API_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d || !Array.isArray(d.items)){
      if(firstLoad){
        $('#grid').innerHTML = '<div class="loader" style="color:#e74c3c">لا توجد بيانات. أضف أصنافاً من لوحة التحكم.</div>';
      }
      return false;
    }
    const sig = d.items.map(i=>i.id+'|'+i.price+'|'+i.available+'|'+(i.name||'')).join('~')
                + '#' + (d.status_text||'') + '#' + (d.ticker_text||'') + '#' + (d.delivery_mode||'') + '#' + (d.delivery_price||'');
    const changed = sig !== lastSig;
    lastSig = sig;
    rawData = d;
    renderAll();
    if(isManual) toast('✅ تم التحديث');
    else if(!firstLoad && changed) showRefresh();
    firstLoad = false;
    return true;
  }catch(e){
    if(firstLoad){
      $('#grid').innerHTML = '<div class="loader" style="color:#e74c3c">تعذر الاتصال.</div>';
    }
    return false;
  }
}

async function forceRefresh(){
  const b = $('#refreshBtn');
  b.classList.add('spin');
  await loadData(true);
  setTimeout(()=>b.classList.remove('spin'), 600);
}

function showRefresh(){
  const b = $('#refreshBadge');
  b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'), 2800);
}

function renderAll(){
  const st = rawData.status_text || '';
  $('#statusText').innerText = st || 'أهلاً بكم';
  $('#statusPill').classList.toggle('closed', /مغلق|مقفل|closed/i.test(st));
  if(rawData.ticker_text) $('#tickerText').innerText = rawData.ticker_text;

  const cats = ['الكل', ...new Set(rawData.items.map(i=>i.category).filter(Boolean))];
  if(!cats.includes(activeCat)) activeCat = 'الكل';
  $('#catsBox').innerHTML = cats.map(c => `<button class="cat ${c===activeCat?'active':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $$('#catsBox .cat').forEach(b => b.onclick = () => { activeCat = b.dataset.c; renderAll(); });

  renderItems();
  updateCartUI();
  if($('#cartPanel').classList.contains('show')) renderCartPanel();
}

function renderItems(){
  const q = ($('#searchInput').value || '').trim().toLowerCase();
  const list = rawData.items.filter(it => {
    const okCat = activeCat === 'الكل' || it.category === activeCat;
    const okQ = !q || (it.name||'').toLowerCase().includes(q) || (it.description||'').toLowerCase().includes(q);
    return okCat && okQ;
  });

  if(!list.length){
    $('#grid').innerHTML = '<div class="loader">لا توجد نتائج</div>';
    return;
  }

  $('#grid').innerHTML = list.map(it => {
    const c = cart[it.id]?.qty || 0;
    const img = esc(it.image || FALLBACK_IMG);
    return `
    <div class="card" data-id="${it.id}">
      <div class="card-img">
        <img src="${img}" loading="lazy" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
        ${it.featured ? '<span class="featured">⭐ الأكثر طلبًا</span>' : ''}
        ${!it.available ? '<span class="badge">نفذ</span>' : ''}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(it.name)}</div>
        <div class="card-desc">${esc(it.description||'')}</div>
        <div class="card-foot">
          <span class="price">${esc(it.price)}</span>
          ${it.available ? (
            c>0
              ? `<div class="qty-mini" onclick="event.stopPropagation()">
                   <button onclick="qty(${it.id},-1)">−</button>
                   <span>${c}</span>
                   <button onclick="qty(${it.id},1)">+</button>
                 </div>`
              : `<button class="add-btn" onclick="event.stopPropagation();qty(${it.id},1)">+</button>`
          ) : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  $$('#grid .card').forEach(card => {
    card.addEventListener('click', () => openItem(parseInt(card.dataset.id)));
  });
}

function openItem(id){
  const it = rawData.items.find(i => i.id === id);
  if(!it) return;
  const c = cart[id]?.qty || 0;
  $('#modalInner').innerHTML = `
    <div style="position:relative">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img src="${esc(it.image||FALLBACK_IMG)}" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
    </div>
    <div class="modal-body">
      <h3>${esc(it.name)}</h3>
      <div class="md-desc">${esc(it.description||'لا يوجد وصف')}</div>
      <div class="md-price">${esc(it.price)}</div>
      ${it.available ? (
        c>0
          ? `<div class="qty-mini" style="justify-content:center;padding:8px;gap:12px">
               <button style="width:42px;height:42px;font-size:1.2rem" onclick="qty(${id},-1);openItem(${id})">−</button>
               <span style="font-size:1.2rem">${c}</span>
               <button style="width:42px;height:42px;font-size:1.2rem" onclick="qty(${id},1);openItem(${id})">+</button>
             </div>`
          : `<button class="add-btn" style="width:100%;height:52px;border-radius:16px" onclick="qty(${id},1);openItem(${id})">أضف للسلة</button>`
      ) : '<div style="text-align:center;color:#e74c3c;font-weight:800">غير متوفر</div>'}
    </div>`;
  $('#itemModal').classList.add('show');
}
function closeModal(){ $('#itemModal').classList.remove('show'); }

function qty(id, delta){
  const it = rawData.items.find(i => i.id === id);
  if(!it) return;
  if(!cart[id]) cart[id] = { name:it.name, price:it.price, qty:0, image:it.image };
  cart[id].qty += delta;
  if(cart[id].qty <= 0) delete cart[id];
  saveCart();
  renderItems();
  updateCartUI();
  if($('#cartPanel').classList.contains('show')) renderCartPanel();
}

function cartSubtotal(){
  let t = 0;
  for(const id in cart) t += num(cart[id].price) * cart[id].qty;
  return t;
}
function deliveryFee(){
  if(orderType !== 'delivery') return 0;
  if(rawData.delivery_mode === 'fixed') return num(rawData.delivery_price);
  return 0;
}
function cartTotal(){ return cartSubtotal() + deliveryFee(); }
function cartCount(){
  let n = 0;
  for(const id in cart) n += cart[id].qty;
  return n;
}

function updateCartUI(){
  const n = cartCount();
  const bar = $('#cartBar');
  $('#cartCnt').innerText = n;
  if(n > 0){
    bar.classList.remove('empty');
    $('#cartLbl').innerText = 'صنف مختار';
    $('#cartTotal').innerText = fmt(cartTotal());
    $('#cartGo').innerText = 'عرض السلة';
  } else {
    bar.classList.add('empty');
    $('#cartLbl').innerText = 'ابدأ الطلب';
    $('#cartGo').innerText = 'اختر أصنافك';
  }
  $('#panelCount').innerText = n;
  $('#panelTotal').innerText = fmt(cartTotal());
}

function saveCart(){ try{ localStorage.setItem('salah_cart', JSON.stringify(cart)); }catch(e){} }
function loadCart(){ try{ const c = localStorage.getItem('salah_cart'); if(c) cart = JSON.parse(c); }catch(e){} }

function openCart(){
  if(cartCount() === 0){ toast('🛒 السلة فارغة'); return; }
  renderCartPanel();
  $('#overlay').classList.add('show');
  $('#cartPanel').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeCart(){
  $('#overlay').classList.remove('show');
  $('#cartPanel').classList.remove('show');
  document.body.style.overflow = '';
}

function renderCartPanel(){
  const box = $('#cartItems');
  const form = $('#orderForm');
  const footer = $('#panelFooter');
  const ids = Object.keys(cart);
  if(!ids.length){
    box.innerHTML = '<div class="empty-cart"><div class="ico">🛒</div><p>السلة فارغة</p></div>';
    form.style.display = 'none';
    footer.style.display = 'none';
    return;
  }
  box.innerHTML = ids.map(id => {
    const it = cart[id];
    const lineTotal = num(it.price) * it.qty;
    return `
    <div class="cart-item">
      <img src="${esc(it.image||FALLBACK_IMG)}" onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
      <div class="info">
        <div class="name">${esc(it.name)}</div>
        <div class="p">${esc(it.price)}</div>
        ${it.qty > 1 ? `<div class="line-total">× ${it.qty} = ${fmt(lineTotal)}</div>` : ''}
      </div>
      <div class="qty">
        <button onclick="qty(${id},-1)">−</button>
        <span>${it.qty}</span>
        <button class="plus" onclick="qty(${id},1)">+</button>
      </div>
    </div>`;
  }).join('');
  form.style.display = 'block';
  footer.style.display = 'block';
  updateDeliveryUI();
  updateTotalsUI();
}

function updateDeliveryUI(){
  const box = $('#deliveryBox');
  if(orderType !== 'delivery'){ box.innerHTML = ''; $('#deliveryRow').classList.add('hide'); return; }
  const mode = rawData.delivery_mode || 'message';
  const price = num(rawData.delivery_price);
  const msg = rawData.delivery_message || '🛵 قيمة التوصيل تُحدد حسب المنطقة';
  if(mode === 'fixed' && price > 0){
    box.innerHTML = `<div class="delivery-info fixed"><span>🛵</span><div><b>رسوم التوصيل:</b> ${fmt(price)}</div></div>`;
    $('#deliveryRow').classList.remove('hide');
    $('#sumDelivery').innerText = fmt(price);
  } else if(mode === 'free'){
    box.innerHTML = `<div class="delivery-info free"><span>🎉</span><div><b>توصيل مجاني!</b></div></div>`;
    $('#deliveryRow').classList.add('hide');
  } else {
    box.innerHTML = `<div class="delivery-info"><span>💬</span><div>${esc(msg)}</div></div>`;
    $('#deliveryRow').classList.add('hide');
  }
}

function updateTotalsUI(){
  $('#sumSubtotal').innerText = fmt(cartSubtotal());
  $('#sumTotal').innerText = fmt(cartTotal());
  $('#panelCount').innerText = cartCount();
  $('#panelTotal').innerText = fmt(cartTotal());
}

$$('#typeToggle button').forEach(b => {
  b.onclick = () => {
    orderType = b.dataset.type;
    $$('#typeToggle button').forEach(x => x.classList.toggle('active', x === b));
    const isDelivery = orderType === 'delivery';
    $('#addrField').classList.toggle('hide', !isDelivery);
    $('#tableField').classList.toggle('hide', isDelivery);
    updateDeliveryUI();
    updateTotalsUI();
  };
});

function sendOrder(){
  const name  = $('#fName').value.trim();
  const phone = $('#fPhone').value.trim();
  const addr  = $('#fAddr').value.trim();
  const table = $('#fTable').value.trim();
  const notes = $('#fNotes').value.trim();

  if(!Object.keys(cart).length) return toast('السلة فارغة', true);
  if(!name)  return toast('أدخل الاسم', true);
  if(!phone) return toast('أدخل رقم الهاتف', true);
  if(orderType === 'delivery' && !addr)   return toast('أدخل العنوان', true);
  if(orderType === 'dinein'   && !table)  return toast('أدخل رقم الطاولة', true);

  const wa = rawData.whatsapp_number || '963900000000';
  const mode = rawData.delivery_mode || 'message';

  let text = `🍓 *طلب جديد — فواكه أبو صلاح*\n━━━━━━━━━━━━━━━\n`;
  text += `👤 *الاسم:* ${name}\n📞 *الهاتف:* ${phone}\n`;
  if(orderType === 'delivery'){
    text += `🛵 *توصيل*\n📍 *العنوان:* ${addr}\n`;
    if(mode === 'fixed' && num(rawData.delivery_price) > 0) text += `💰 *رسوم التوصيل:* ${fmt(num(rawData.delivery_price))}\n`;
    else if(mode === 'free') text += `🎉 *توصيل مجاني*\n`;
  } else {
    text += `🍽️ *بالطاولة*\n🪑 *رقم الطاولة:* ${table}\n`;
  }
  text += `━━━━━━━━━━━━━━━\n*🛒 الأصناف:*\n`;
  for(const id in cart){
    const it = cart[id];
    text += `• ${it.name} × ${it.qty}  =  ${fmt(num(it.price) * it.qty)}\n`;
  }
  text += `━━━━━━━━━━━━━━━\n`;
  text += `💵 *المجموع:* ${fmt(cartSubtotal())}\n`;
  if(orderType === 'delivery' && mode === 'fixed' && num(rawData.delivery_price) > 0)
    text += `🛵 *التوصيل:* ${fmt(num(rawData.delivery_price))}\n`;
  text += `💰 *الإجمالي:* ${fmt(cartTotal())}\n`;
  if(orderType === 'delivery' && mode === 'message' && rawData.delivery_message)
    text += `\n⚠️ _${rawData.delivery_message}_\n`;
  if(notes) text += `\n📝 *ملاحظات:* ${notes}\n`;

  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(text)}`, '_blank');
  toast('✅ تم فتح واتساب');
}

$('#searchInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderItems, 150);
});

document.addEventListener('DOMContentLoaded', () => {
  loadCart();
  loadData();
  setInterval(() => loadData(), POLL_MS);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) loadData(); });
});

window.addEventListener('popstate', () => {
  if($('#itemModal').classList.contains('show')) closeModal();
  else if($('#cartPanel').classList.contains('show')) closeCart();
});
</script>
</body>
</html>
