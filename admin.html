<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | فواكه أبو صلاح</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #081d13; color: white; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #f39c12; margin-bottom: 10px; font-weight: 900; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
    label { display: block; font-size: 0.88rem; color: #ffe082; margin-bottom: 6px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; margin-bottom: 12px; }
    .btn { background: #f39c12; color: #05140d; font-weight: 800; padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; }
    .btn-green { background: #27ae60; color: white; }
    .btn-danger { background: #c62828; color: white; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

  <h1>لوحة إدارة المنيو 🛠️</h1>
  <p style="color: #a4c2b2; margin-bottom: 20px;">عدّل البيانات أو الأصناف، ثم اضغط "تحميل ملف data.json الجديد" وارفعه إلى GitHub.</p>

  <div class="card">
    <h3>إعدادات المحل العامة</h3>
    <br>
    <label>رقم الواتساب (مع رمز الدولة):</label>
    <input type="text" id="waNum">

    <label>رقم الاتصال المباشر:</label>
    <input type="text" id="phoneNum">

    <label>نص الحالة (مثل: مفتوح الآن):</label>
    <input type="text" id="statusTxt">

    <label>نص الشريط المتحرك:</label>
    <input type="text" id="tickerTxt">
  </div>

  <div class="card">
    <h3>الأصناف والأسعار</h3>
    <div id="itemsContainer"></div>
  </div>

  <button class="btn btn-green" style="width: 100%; padding: 16px; font-size: 1.1rem;" onclick="downloadJSON()">
    💾 تحميل ملف data.json المُحدث
  </button>

  <script>
    let appData = {};

    fetch('../data.json')
      .then(res => res.json())
      .then(data => {
        appData = data;
        loadAdminData();
      });

    function loadAdminData() {
      document.getElementById('waNum').value = appData.whatsapp_number || "";
      document.getElementById('phoneNum').value = appData.phone_number || "";
      document.getElementById('statusTxt').value = appData.status_text || "";
      document.getElementById('tickerTxt').value = appData.ticker_text || "";

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      appData.items.forEach((item, index) => {
        container.innerHTML += `
          <div class="item-row">
            <div>
              <strong>${item.name}</strong> - <span style="color:#f39c12">${item.price}</span> (${item.category})
            </div>
            <div>
              <button class="btn" onclick="toggleAvail(${index})">${item.available ? 'تعطيل' : 'تفعيل'}</button>
            </div>
          </div>
        `;
      });
    }

    function toggleAvail(index) {
      appData.items[index].available = !appData.items[index].available;
      loadAdminData();
    }

    function downloadJSON() {
      appData.whatsapp_number = document.getElementById('waNum').value;
      appData.phone_number = document.getElementById('phoneNum').value;
      appData.status_text = document.getElementById('statusTxt').value;
      appData.ticker_text = document.getElementById('tickerTxt').value;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", "data.json");
      dlAnchorElem.click();
    }
  </script>
</body>
</html>
