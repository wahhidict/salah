<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | فواكه أبو صلاح</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #081d13; color: white; padding: 20px; max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
    h1 { color: #f39c12; margin-bottom: 8px; font-weight: 900; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 20px; margin-bottom: 22px; }
    label { display: block; font-size: 0.88rem; color: #ffe082; margin-bottom: 6px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 11px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; margin-bottom: 14px; font-size: 0.95rem; }
    input:focus, textarea:focus, select:focus { border-color: #f39c12; outline: none; }
    .btn { background: #f39c12; color: #05140d; font-weight: 800; padding: 10px 18px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: #27ae60; color: white; }
    .btn-blue { background: #2980b9; color: white; }
    .btn-danger { background: #c62828; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

    .item-card-admin { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .item-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .preview-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #222; }

    .upload-box { background: rgba(243, 156, 18, 0.1); border: 2px dashed #f39c12; padding: 15px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 14px; }
    .edit-form { margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); display: none; }

    #statusToast { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 400px; margin: 0 auto; background: #27ae60; color: white; padding: 14px 20px; border-radius: 12px; text-align: center; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 9999; }
    #statusToast.error { background: #c62828; }

    .data-size { font-size: 0.78rem; color: #a4c2b2; margin-top: 6px; }
    .data-size.warn { color: #f39c12; }
    .data-size.danger { color: #e74c3c; font-weight: 800; }
  </style>
</head>
<body>

  <h1>لوحة إدارة المنيو ⚡</h1>
  <p style="color: #a4c2b2; margin-bottom: 18px; font-size: 0.9rem;">تعديل فوري يظهر مباشرةً لكل زبون بمجرد الحفظ.</p>

  <div id="tokenSection" style="display:none; margin-bottom: 22px;">
    <div style="background:rgba(243, 156, 18, 0.15); border:1px solid #f39c12; padding:16px; border-radius:14px;">
      <label style="color:#ffe082; font-weight:700; margin-bottom:8px; display:block;">🔑 أدخل توكن GitHub (مرة واحدة فقط):</label>
      <div style="display:flex; gap:8px;">
        <input type="password" id="inputToken" placeholder="ghp_..." style="margin-bottom:0;">
        <button class="btn btn-green" onclick="saveInputToken()" style="white-space:nowrap;">حفظ</button>
      </div>
      <div style="font-size:0.75rem; color:#a4c2b2; margin-top:8px;">يحتاج صلاحية <code>repo</code> فقط.</div>
    </div>
  </div>

  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:12px;">1️⃣ الإعدادات العامة للمحل</h3>
    <label>رقم الواتساب (مع رمز الدولة):</label>
    <input type="text" id="waNum">
    <label>رقم الاتصال المباشر:</label>
    <input type="text" id="phoneNum">
    <label>حالة المحل:</label>
    <input type="text" id="statusTxt">
    <label>نص الشريط المتحرك:</label>
    <input type="text" id="tickerTxt">
    <button class="btn btn-green" id="btnSaveSettings" style="width: 100%; padding: 12px;" onclick="saveGeneralSettings()">⚡ حفظ الإعدادات ونشرها فوراً</button>
  </div>

  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:12px;">2️⃣ إضافة صنف جديد</h3>
    <label>اسم الصنف:</label>
    <input type="text" id="newItemName" placeholder="مثال: كوكتيل امبراطور">
    <label>التصنيف:</label>
    <input type="text" id="newItemCat" placeholder="مثال: كوكتيلات أبو صلاح">
    <label>الوصف والمكونات:</label>
    <input type="text" id="newItemDesc" placeholder="مثال: فواكه، قشطة، عسل ومكسرات">
    <label>السعر:</label>
    <input type="text" id="newItemPrice" placeholder="مثال: 35,000 ل.س">
    <label>صورة الصنف 📸:</label>
    <div class="upload-box" onclick="document.getElementById('newItemImgFile').click()">
      <span id="fileStatusText">اضغط هنا لاختيار صورة</span>
      <input type="file" id="newItemImgFile" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
    </div>
    <input type="hidden" id="newItemImgBase64">
    <button class="btn btn-green" id="btnAddItem" style="width: 100%; padding: 14px; font-size: 1rem;" onclick="addNewItem()">⚡ إضافة الصنف ونشره فوراً</button>
  </div>

  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:15px;">3️⃣ الأصناف الموجودة</h3>
    <div id="itemsContainer">جاري التحميل...</div>
    <div id="dataSizeLabel" class="data-size"></div>
  </div>

  <div style="text-align: center; margin-top: 30px;">
    <button onclick="resetToken()" style="background:none; border:none; color:#a4c2b2; text-decoration:underline; font-size:0.75rem; cursor:pointer;">إعادة ضبط التوكن 🔑</button>
  </div>

  <div id="statusToast"></div>

  <script>
    /* ============ الإعدادات ============ */
    const GITHUB_OWNER  = "wahhidict";
    const GITHUB_REPO   = "salah";
    const GITHUB_BRANCH = "main";  // ← غيّرها إلى "master" إذا لزم
    const FILE_PATH     = "data.json";

    let appData = { items: [] };
    let isSaving = false;

    document.addEventListener("DOMContentLoaded", () => {
      checkTokenUI();
      fetchData();
    });

    /* ============ التوكن ============ */
    function checkTokenUI() {
      const t = localStorage.getItem("gh_token");
      document.getElementById("tokenSection").style.display = t ? "none" : "block";
    }
    function saveInputToken() {
      const v = document.getElementById("inputToken").value.trim();
      if (!v) return alert("الصق التوكن أولاً");
      localStorage.setItem("gh_token", v);
      checkTokenUI();
      showToast("✅ تم حفظ التوكن");
    }
    function resetToken() {
      if (confirm("مسح التوكن وإدخال جديد؟")) {
        localStorage.removeItem("gh_token");
        checkTokenUI();
      }
    }
    function handleTokenExpired() {
      showToast("⚠️ التوكن منتهي أو غير صالح، أعد إدخاله", true);
      localStorage.removeItem("gh_token");
      checkTokenUI();
    }

    /* ============ جلب البيانات ============ */
    async function fetchData() {
      const ts = Date.now();
      const sources = [
        {
          url: `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}?ref=${GITHUB_BRANCH}&t=${ts}`,
          headers: { 'Accept': 'application/vnd.github.v3.raw' }
        },
        { url: `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${FILE_PATH}?t=${ts}` },
        { url: `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${FILE_PATH}?t=${ts}` },
        { url: `./${FILE_PATH}?t=${ts}` }
      ];

      for (const src of sources) {
        try {
          const res = await fetch(src.url, { headers: src.headers || {}, cache: 'no-store' });
          if (!res.ok) continue;
          const data = await res.json();
          if (!data || !Array.isArray(data.items)) continue;
          appData = data;
          loadAdminData();
          return;
        } catch (e) { /* next */ }
      }
      document.getElementById('itemsContainer').innerHTML =
        '<p style="color:#e74c3c;">تعذر جلب data.json من أي مصدر.</p>';
    }

    function loadAdminData() {
      document.getElementById('waNum').value     = appData.whatsapp_number || "";
      document.getElementById('phoneNum').value  = appData.phone_number    || "";
      document.getElementById('statusTxt').value = appData.status_text     || "";
      document.getElementById('tickerTxt').value = appData.ticker_text     || "";
      renderItemsList();
    }

    /* ============ Toast ============ */
    let toastTimer = null;
    function showToast(msg, isError = false) {
      const t = document.getElementById("statusToast");
      t.innerText = msg;
      t.className = isError ? "error" : "";
      t.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = "none"; }, 4000);
    }

    /* ============ المزامنة مع GitHub ============ */
    async function syncToGitHub(commitMsg, retry = 0) {
      if (isSaving) { showToast("⏳ عملية حفظ جارية..."); return false; }
      const token = localStorage.getItem("gh_token");
      if (!token) { alert("أدخل التوكن أولاً"); checkTokenUI(); return false; }

      isSaving = true;
      showToast("⏳ جاري النشر...");

      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
        const headers = {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        };

        // 1. جلب SHA الحالي
        const getRes = await fetch(`${apiUrl}?ref=${GITHUB_BRANCH}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.status === 401) { handleTokenExpired(); return false; }

        let sha = "";
        if (getRes.ok) {
          const info = await getRes.json();
          sha = info.sha;
        } else if (getRes.status !== 404) {
          throw new Error('فشل جلب SHA (كود ' + getRes.status + ')');
        }

        // 2. بناء المحتوى
        const jsonString = JSON.stringify(appData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const body = {
          message: commitMsg || "تحديث المنيو",
          content: base64Content,
          branch: GITHUB_BRANCH
        };
        if (sha) body.sha = sha;

        // 3. رفع
        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (putRes.status === 401) { handleTokenExpired(); return false; }

        if (putRes.status === 409 && retry < 2) {
          // تعارض SHA — أعد المحاولة بعد جلب SHA جديد
          await new Promise(r => setTimeout(r, 500));
          isSaving = false;
          return await syncToGitHub(commitMsg, retry + 1);
        }

        if (!putRes.ok) {
          const err = await putRes.json().catch(() => ({}));
          throw new Error(err.message || ('فشل الرفع (كود ' + putRes.status + ')'));
        }

        showToast("✅ تم النشر! الزبائن سيشاهدون التحديث خلال ثوانٍ");
        return true;

      } catch (e) {
        showToast("❌ " + e.message, true);
        return false;
      } finally {
        isSaving = false;
      }
    }

    /* ============ ضغط الصور ============ */
    function compressImage(file, maxDim = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              const r = Math.min(maxDim / width, maxDim / height);
              width  = Math.round(width  * r);
              height = Math.round(height * r);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            try {
              resolve(canvas.toDataURL('image/webp', quality));
            } catch (e) {
              resolve(canvas.toDataURL('image/jpeg', quality));
            }
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    /* ============ إضافة صنف ============ */
    async function handleImageUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const st = document.getElementById('fileStatusText');
      st.innerText = "⏳ جاري ضغط الصورة...";
      try {
        const dataUrl = await compressImage(file);
        document.getElementById('newItemImgBase64').value = dataUrl;
        const kb = Math.round(dataUrl.length / 1024);
        st.innerText = `✅ تم تجهيز الصورة (${kb} KB)`;
      } catch (e) {
        st.innerText = "❌ فشل معالجة الصورة";
      }
    }

    async function addNewItem() {
      const name  = document.getElementById('newItemName').value.trim();
      const cat   = document.getElementById('newItemCat').value.trim();
      const desc  = document.getElementById('newItemDesc').value.trim();
      const price = document.getElementById('newItemPrice').value.trim();
      const img   = document.getElementById('newItemImgBase64').value;

      if (!name || !cat || !price) return alert("يرجى إدخال الاسم والتصنيف والسعر");
      if (!img) return alert("يرجى اختيار صورة للصنف");

      if (!appData.items) appData.items = [];
      appData.items.push({
        id: Date.now(),
        name, category: cat, description: desc, price,
        available: true, image: img
      });

      const btn = document.getElementById('btnAddItem');
      btn.disabled = true; btn.innerText = "⏳ جاري النشر...";
      const ok = await syncToGitHub(`إضافة صنف: ${name}`);
      btn.disabled = false; btn.innerText = "⚡ إضافة الصنف ونشره فوراً";

      if (ok) {
        renderItemsList();
        ['newItemName','newItemCat','newItemDesc','newItemPrice','newItemImgBase64']
          .forEach(id => document.getElementById(id).value = '');
        document.getElementById('fileStatusText').innerText = "اضغط هنا لاختيار صورة";
      }
    }

    /* ============ عرض الأصناف ============ */
    function renderItemsList() {
      const container = document.getElementById('itemsContainer');
      const items = appData.items || [];

      if (!items.length) {
        container.innerHTML = '<p style="color:#a4c2b2;">لا توجد أصناف حالياً.</p>';
      } else {
        container.innerHTML = items.map((item, i) => `
          <div class="item-card-admin">
            <div class="item-row">
              <img src="${item.image}" class="preview-img" onerror="this.src='https://placehold.co/65x65/222/fff?text=?'">
              <div style="flex:1; min-width:0;">
                <strong style="font-size:1rem;">${escapeHtml(item.name)}</strong>
                <div style="font-size:0.8rem; color:#ffe082;">${escapeHtml(item.price)} • ${escapeHtml(item.category)}</div>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
                <button class="btn btn-sm btn-blue" onclick="toggleEditForm(${i})">تعديل ✏️</button>
                <button class="btn btn-sm ${item.available ? 'btn-green' : ''}" onclick="toggleAvail(${i})">${item.available ? 'متوفر' : 'غير متوفر'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${i})">حذف 🗑️</button>
              </div>
            </div>
            <div class="edit-form" id="editForm_${i}">
              <label>اسم الصنف:</label>
              <input type="text" id="editName_${i}" value="${escapeAttr(item.name)}">
              <label>التصنيف:</label>
              <input type="text" id="editCat_${i}" value="${escapeAttr(item.category)}">
              <label>الوصف:</label>
              <input type="text" id="editDesc_${i}" value="${escapeAttr(item.description || '')}">
              <label>السعر:</label>
              <input type="text" id="editPrice_${i}" value="${escapeAttr(item.price)}">
              <label>تغيير الصورة (اختياري):</label>
              <input type="file" accept="image/*" onchange="handleEditImageUpload(this, ${i})">
              <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-green btn-sm" onclick="saveItemEdit(${i})">حفظ ونشر ✅</button>
                <button class="btn btn-danger btn-sm" onclick="toggleEditForm(${i})">إلغاء</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      // مؤشر حجم البيانات
      try {
        const sizeKB = Math.round(JSON.stringify(appData).length / 1024);
        const lbl = document.getElementById('dataSizeLabel');
        lbl.className = 'data-size';
        lbl.innerText = `حجم data.json الحالي: ${sizeKB} KB`;
        if (sizeKB > 900) { lbl.classList.add('danger'); lbl.innerText += ' — خطر! قرّب من حد GitHub (1MB)'; }
        else if (sizeKB > 600) { lbl.classList.add('warn'); lbl.innerText += ' — كبير نسبياً'; }
      } catch(e) {}
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
      ));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

    function toggleEditForm(i) {
      const f = document.getElementById(`editForm_${i}`);
      f.style.display = (f.style.display === "block") ? "none" : "block";
    }

    async function handleEditImageUpload(input, i) {
      const file = input.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImage(file);
        appData.items[i].image = dataUrl;
        alert("✅ تم ضغط الصورة محلياً. اضغط «حفظ ونشر» لتفعيلها.");
      } catch (e) {
        alert("❌ فشل معالجة الصورة");
      }
    }

    async function saveItemEdit(i) {
      appData.items[i].name        = document.getElementById(`editName_${i}`).value.trim();
      appData.items[i].category    = document.getElementById(`editCat_${i}`).value.trim();
      appData.items[i].description = document.getElementById(`editDesc_${i}`).value.trim();
      appData.items[i].price       = document.getElementById(`editPrice_${i}`).value.trim();

      const ok = await syncToGitHub(`تعديل صنف: ${appData.items[i].name}`);
      if (ok) renderItemsList();
    }

    async function toggleAvail(i) {
      appData.items[i].available = !appData.items[i].available;
      const ok = await syncToGitHub(`تغيير حالة: ${appData.items[i].name}`);
      if (ok) renderItemsList();
    }

    async function deleteItem(i) {
      if (!confirm('تأكيد حذف الصنف؟')) return;
      const name = appData.items[i].name;
      appData.items.splice(i, 1);
      const ok = await syncToGitHub(`حذف صنف: ${name}`);
      if (ok) renderItemsList();
    }

    /* ============ الإعدادات العامة ============ */
    async function saveGeneralSettings() {
      appData.whatsapp_number = document.getElementById('waNum').value.trim();
      appData.phone_number    = document.getElementById('phoneNum').value.trim();
      appData.status_text     = document.getElementById('statusTxt').value.trim();
      appData.ticker_text     = document.getElementById('tickerTxt').value.trim();
      await syncToGitHub("تحديث الإعدادات العامة");
    }
  </script>
</body>
</html>
