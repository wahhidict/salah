<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | فواكه أبو صلاح</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background: #071911; color: #eaf3ed; padding: 20px; max-width: 850px; margin: 0 auto; }
    h1 { color: #d4af37; margin-bottom: 20px; font-size: 1.6rem; text-align: center; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 18px; padding: 20px; margin-bottom: 20px; }
    label { display: block; font-weight: 700; margin-top: 12px; margin-bottom: 4px; color: #d4af37; font-size: 0.9rem; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0,0,0,0.3); color: white; border-radius: 8px; font-family: inherit; font-size: 0.95rem; }
    .item-box { border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 14px; margin-bottom: 15px; background: rgba(0, 0, 0, 0.25); }
    .btn { background: #d4af37; color: #071911; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 1rem; margin-top: 10px; width: 100%; }
    .btn-add { background: #1b5e3a; color: white; width: auto; padding: 8px 18px; font-size: 0.9rem; }
    .btn-danger { background: #c62828; color: white; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; border: none; cursor: pointer; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
  </style>
</head>
<body>

  <h1>⚙ لوحة إدارة المنيو والخيارات بالكامل</h1>

  <!-- إعدادات شريط الإعلانات التفاعلي -->
  <div class="card">
    <h3 style="color:#fff;">📣 شريط الإعلانات العلوي (Ticker Bar)</h3>
    <label>حالة ظهور الشريط</label>
    <select id="tickerActive">
      <option value="true">مفكّل (ظاهر للزبائن)</option>
      <option value="false">معطّل (مخفي من الصفحة)</option>
    </select>

    <label>نص الإعلان أو التنبيه</label>
    <input type="text" id="tickerText">
  </div>

  <div class="card">
    <h3 style="color:#fff;">📌 أزرار التواصل والمعلومات</h3>
    <div class="row">
      <div><label>رقم الواتساب للطلبات</label><input type="text" id="waNumber"></div>
      <div><label>رقم الاتصال المباشر</label><input type="text" id="phoneNum"></div>
    </div>
    <label>رابط خرائط جوجل (Google Maps)</label>
    <input type="text" id="mapLink">

    <label>عبارة حالة المحل (أعلى الصفحة)</label>
    <input type="text" id="statusTxt">
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h3 style="color:#fff;">🍹 الأصناف والتصنيفات</h3>
      <button class="btn btn-add" onclick="addItem()">+ إضافة صنف جديد</button>
    </div>
    <div id="itemsContainer"></div>
  </div>

  <button class="btn" onclick="downloadJSON()">💾 حفظ وتحميل ملف data.json الجديد</button>

  <script>
    let currentData = {};

    fetch('../data.json')
      .then(res => res.json())
      .then(data => { currentData = data; loadForm(); })
      .catch(() => alert('قم بتحديد البيانات أو إضافة أصناف جديدة'));

    function loadForm() {
      document.getElementById('tickerActive').value = currentData.ticker_active ? "true" : "false";
      document.getElementById('tickerText').value = currentData.ticker_text || '';
      document.getElementById('waNumber').value = currentData.whatsapp_number || '';
      document.getElementById('phoneNum').value = currentData.phone_number || '';
      document.getElementById('mapLink').value = currentData.map_link || '';
      document.getElementById('statusTxt').value = currentData.status_text || '';

      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      (currentData.items || []).forEach((item, index) => {
        container.innerHTML += `
          <div class="item-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
              <strong style="color: #d4af37;">الصنف #${index + 1}</strong>
              <button class="btn-danger" onclick="removeItem(${index})">حذف الصنف</button>
            </div>
            <div class="row">
              <div><label>اسم الصنف</label><input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)"></div>
              <div><label>القسم (التصنيف)</label><input type="text" value="${item.category}" onchange="updateItem(${index}, 'category', this.value)"></div>
            </div>
            <div class="row">
              <div><label>السعر</label><input type="text" value="${item.price}" onchange="updateItem(${index}, 'price', this.value)"></div>
              <div><label>شارة اختيارية</label><input type="text" value="${item.badge || ''}" onchange="updateItem(${index}, 'badge', this.value)"></div>
            </div>
            <label>الوصف والمكونات</label>
            <textarea onchange="updateItem(${index}, 'description', this.value)">${item.description}</textarea>
            <div class="row">
              <div><label>رابط الصورة</label><input type="text" value="${item.image}" onchange="updateItem(${index}, 'image', this.value)"></div>
              <div>
                <label>حالة التوفر</label>
                <select onchange="updateItem(${index}, 'available', this.value === 'true')">
                  <option value="true" ${item.available ? 'selected' : ''}>متوفر</option>
                  <option value="false" ${!item.available ? 'selected' : ''}>غير متوفر</option>
                </select>
              </div>
            </div>
          </div>
        `;
      });
    }

    function updateItem(index, field, value) { currentData.items[index][field] = value; }
    function addItem() {
      if(!currentData.items) currentData.items = [];
      currentData.items.push({ id: Date.now(), name: "صنف جديد", category: "عصائر", description: "", price: "0 ل.س", available: true, badge: "", image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80" });
      loadForm();
    }
    function removeItem(index) { currentData.items.splice(index, 1); loadForm(); }

    function downloadJSON() {
      currentData.ticker_active = document.getElementById('tickerActive').value === 'true';
      currentData.ticker_text = document.getElementById('tickerText').value;
      currentData.whatsapp_number = document.getElementById('waNumber').value;
      currentData.phone_number = document.getElementById('phoneNum').value;
      currentData.map_link = document.getElementById('mapLink').value;
      currentData.status_text = document.getElementById('statusTxt').value;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
</html>
