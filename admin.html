<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فواكه أبو صلاح | المنيو الفاخر</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #03120b 0%, #08281a 50%, #020b07 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(15, 41, 28, 0.55);
      --accent-gold: #f39c12;
      --accent-gold-light: #ffe082;
      --accent-green: #2ecc71;
      --text-main: #ffffff;
      --text-sub: #a4c2b2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    /* Header Design */
    .header {
      background: rgba(3, 18, 11, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(45deg, #f39c12, #ffe082);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 204, 113, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(46, 204, 113, 0.4);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-top: 6px;
    }
    .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }

    /* News Ticker */
    .ticker-wrap {
      background: rgba(243, 156, 18, 0.15);
      border-y: 1px solid rgba(243, 156, 18, 0.3);
      color: var(--accent-gold-light);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 0;
      overflow: hidden;
      white-space: nowrap;
      backdrop-filter: blur(5px);
    }
    .ticker { display: inline-block; animation: marquee 22s linear infinite; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    .main-container { padding: 16px; max-width: 750px; margin: 0 auto; }

    /* Search Box */
    .search-box {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 12px 18px;
      border-radius: 16px;
      color: #fff;
      font-size: 0.95rem;
      backdrop-filter: blur(10px);
      outline: none;
      transition: 0.3s;
    }
    .search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 15px rgba(243, 156, 18, 0.2); }
    .search-input::placeholder { color: var(--text-sub); }

    /* Categories Scroll */
    .categories-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }
    
    .cat-pill {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .cat-pill.active {
      background: linear-gradient(135deg, #f39c12, #d35400);
      color: #000;
      border-color: #f39c12;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.35);
    }

    /* Grid & Cards */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .item-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
    }
    .item-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

    .img-container { position: relative; width: 100%; height: 140px; overflow: hidden; background: #081a11; }
    .item-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .item-card:hover .item-img { transform: scale(1.06); }

    .unavail-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(198, 40, 40, 0.85);
      color: #fff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 800;
      backdrop-filter: blur(5px);
    }

    .item-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-size: 1rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .item-desc { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-price { font-size: 0.98rem; font-weight: 900; color: var(--accent-gold-light); margin-bottom: 8px; }

    .add-cart-btn {
      background: rgba(243, 156, 18, 0.15);
      color: var(--accent-gold-light);
      border: 1px solid rgba(243, 156, 18, 0.4);
      width: 100%;
      padding: 9px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-cart-btn:active { background: var(--accent-gold); color: #000; }

    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 3px;
    }
    .qty-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
    }
    .qty-num { font-weight: 800; font-size: 0.9rem; color: #fff; }

    /* Cart Floating Bar */
    .cart-float-bar {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 718px;
      margin: 0 auto;
      background: rgba(39, 174, 96, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      padding: 14px 20px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 99;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cart-float-bar:active { transform: scale(0.98); }
    .cart-send-btn { background: #fff; color: #1e8449; padding: 8px 16px; border-radius: 12px; font-size: 0.88rem; font-weight: 900; }

    /* Loading Spinner */
    .loader-box { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub); }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand-title">🍓 فواكه أبو صلاح</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="statusText">مفتوح الآن • خدمة توصيل</span>
    </div>
  </header>

  <div class="ticker-wrap">
    <div class="ticker" id="tickerText">أهلاً بكم في فواكه أبو صلاح • أطيب الكوكتيلات والعصائر الفريش • كفرسوسة</div>
  </div>

  <main class="main-container">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث عن صنف أو عصير..." oninput="handleSearch()">
    </div>

    <div class="categories-scroll" id="categoriesBox">
      <button class="cat-pill active">الكل</button>
    </div>

    <div class="items-grid" id="itemsGrid">
      <div class="loader-box">جاري تحميل المنيو اللحظي...⚡</div>
    </div>
  </main>

  <div class="cart-float-bar" id="cartBar" style="display: none;" onclick="sendWhatsAppOrder()">
    <div>
      <span style="font-size:1.1rem;">🛒 السلة:</span> 
      <strong id="cartCount">0</strong> صنف
    </div>
    <div class="cart-send-btn">طلب عبر الواتساب 💬</div>
  </div>

  <script>
    let rawData = { items: [] };
    let activeCategory = 'الكل';
    let cart = {};

    document.addEventListener("DOMContentLoaded", () => {
      fetchMenuFast();
    });

    // جلب البيانات بسرعة فائقة مباشرة من GitHub Raw لمنع الكاش والتأخير
    async function fetchMenuFast() {
      const timestamp = Date.now();
      const rawUrl = `https://raw.githubusercontent.com/wahhidict/salah/main/data.json?t=${timestamp}`;

      try {
        const response = await fetch(rawUrl, { cache: "no-store" });
        if (response.ok) {
          rawData = await response.json();
          initMenu();
          return;
        }
      } catch (e) {
        console.warn("جاري استخدام الرابط الاحتياطي للمنيو...");
      }

      // احتياطي في حال التعذر
      fetch(`data.json?v=${timestamp}`)
        .then(res => res.json())
        .then(data => { rawData = data; initMenu(); })
        .catch(err => {
          document.getElementById('itemsGrid').innerHTML = '<div class="loader-box" style="color:#e74c3c;">تعذر تحميل المنيو حالياً. يرجى إعادة تحديث الصفحة.</div>';
        });
    }

    function initMenu() {
      if(rawData.status_text) document.getElementById('statusText').innerText = rawData.status_text;
      if(rawData.ticker_text) document.getElementById('tickerText').innerText = rawData.ticker_text;

      const categories = ['الكل', ...new Set(rawData.items.map(i => i.category))];
      const catBox = document.getElementById('categoriesBox');
      catBox.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-pill ${cat === activeCategory ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => selectCategory(cat, btn);
        catBox.appendChild(btn);
      });

      renderItems();
    }

    function selectCategory(cat, element) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
      renderItems();
    }

    function handleSearch() {
      renderItems();
    }

    function renderItems() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = rawData.items.filter(item => {
        const matchCat = activeCategory === 'الكل' || item.category === activeCategory;
        const matchSearch = item.name.toLowerCase().includes(query) || (item.description && item.description.toLowerCase().includes(query));
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="loader-box">لا توجد نتائج مطابقة لتحديدك.</div>';
        return;
      }

      filtered.forEach(item => {
        const qty = cart[item.id] ? cart[item.id].qty : 0;

        grid.innerHTML += `
          <div class="item-card">
            <div class="img-container">
              <img src="${item.image}" class="item-img" onerror="this.src='https://via.placeholder.com/200x140?text=فواكه+أبو+صلاح'">
              ${!item.available ? '<div class="unavail-tag">غير متوفر</div>' : ''}
            </div>
            <div class="item-details">
              <div>
                <div class="item-title">${item.name}</div>
                <div class="item-desc">${item.description || ''}</div>
              </div>
              <div>
                <div class="item-price">${item.price}</div>
                ${item.available ? `
                  ${qty > 0 ? `
                    <div class="qty-controls">
                      <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                      <span class="qty-num">${qty}</span>
                      <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                  ` : `
                    <button class="add-cart-btn" onclick="updateQty(${item.id}, 1)">+ إضافة للسلة</button>
                  `}
                ` : ''}
              </div>
            </div>
          </div>
        `;
      });
    }

    function updateQty(id, delta) {
      const item = rawData.items.find(i => i.id === id);
      if(!item) return;

      if(!cart[id]) {
        cart[id] = { name: item.name, price: item.price, qty: 0 };
      }

      cart[id].qty += delta;

      if(cart[id].qty <= 0) {
        delete cart[id];
      }

      updateCartBarUI();
      renderItems();
    }

    function updateCartBarUI() {
      let totalItems = 0;
      for(let id in cart) {
        totalItems += cart[id].qty;
      }

      const bar = document.getElementById('cartBar');
      if(totalItems > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartCount').innerText = totalItems;
      } else {
        bar.style.display = 'none';
      }
    }

    function sendWhatsAppOrder() {
      const waNum = rawData.whatsapp_number || "963900000000";
      let text = "🍓 *طلب جديد من المنيو الإلكتروني - فواكه أبو صلاح*:\n\n";
      
      for(let id in cart) {
        text += `• *${cart[id].name}* × ${cart[id].qty} (${cart[id].price})\n`;
      }
      
      text += "\n📍 *التفاصيل والعنوان*: ";
      
      const url = `https://wa.me/${waNum}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
