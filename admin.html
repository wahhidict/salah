<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | فواكه أبو صلاح</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background: #081d13; color: white; padding: 20px; max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
    h1 { color: #f39c12; margin-bottom: 8px; font-weight: 900; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 20px; margin-bottom: 22px; }
    label { display: block; font-size: 0.88rem; color: #ffe082; margin-bottom: 6px; font-weight: 700; }
    input, textarea, select { width: 100%; padding: 11px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; margin-bottom: 14px; font-size: 0.95rem; }
    input:focus, textarea:focus, select:focus { border-color: #f39c12; outline: none; }
    .btn { background: #f39c12; color: #05140d; font-weight: 800; padding: 10px 18px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { opacity: 0.9; }
    .btn-green { background: #27ae60; color: white; }
    .btn-blue { background: #2980b9; color: white; }
    .btn-danger { background: #c62828; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    
    .item-card-admin { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .item-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .preview-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; background: #222; }
    
    .upload-box { background: rgba(243, 156, 18, 0.1); border: 2px dashed #f39c12; padding: 15px; text-align: center; border-radius: 12px; cursor: pointer; margin-bottom: 14px; }
    .edit-form { margin-top: 15px; padding-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); display: none; }

    #statusToast { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 400px; margin: 0 auto; background: #27ae60; color: white; padding: 14px 20px; border-radius: 12px; text-align: center; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 9999; }
    #statusToast.error { background: #c62828; }
  </style>
</head>
<body>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
    <h1>لوحة إدارة المنيو ⚡</h1>
    <button class="btn btn-sm btn-danger" style="font-size:0.75rem;" onclick="resetToken()">إعادة ضبط التوكن 🔑</button>
  </div>
  <p style="color: #a4c2b2; margin-bottom: 20px; font-size: 0.9rem;">أي إضافة أو تعديل ينعكس مباشرة على صفحة الزبون تلقائياً.</p>

  <!-- الإعدادات العامة -->
  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:12px;">1️⃣ الإعدادات العامة للمحل</h3>
    <label>رقم الواتساب (مع رمز الدولة):</label>
    <input type="text" id="waNum">

    <label>رقم الاتصال المباشر:</label>
    <input type="text" id="phoneNum">

    <label>حالة المحل (مثل: مفتوح الآن • خدمة توصيل):</label>
    <input type="text" id="statusTxt">

    <label>نص الشريط المتحرك:</label>
    <input type="text" id="tickerTxt">

    <button class="btn btn-green" style="width: 100%; padding: 12px;" onclick="saveGeneralSettings()">⚡ حفظ الإعدادات العامة تلقائياً</button>
  </div>

  <!-- إضافة صنف جديد -->
  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:12px;">2️⃣ إضافة صنف جديد للمنيو</h3>
    
    <label>اسم الصنف:</label>
    <input type="text" id="newItemName" placeholder="مثال: كوكتيل امبراطور">

    <label>التصنيف:</label>
    <input type="text" id="newItemCat" placeholder="مثال: كوكتيلات أبو صلاح">

    <label>الوصف والمكونات:</label>
    <input type="text" id="newItemDesc" placeholder="مثال: فواكه، قشطة، عسل ومكسرات">

    <label>السعر:</label>
    <input type="text" id="newItemPrice" placeholder="مثال: 35,000 ل.س">

    <label>اختيار صورة للصنف من الموبايل أو الجهاز 📸:</label>
    <div class="upload-box" onclick="document.getElementById('newItemImgFile').click()">
      <span id="fileStatusText">اضغط هنا لاختيار صورة من استوديو الموبايل</span>
      <input type="file" id="newItemImgFile" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
    </div>
    <input type="hidden" id="newItemImgBase64">

    <button class="btn btn-green" style="width: 100%; padding: 14px; font-size: 1rem;" onclick="addNewItem()">⚡ إضافة الصنف وحفظه فوراً لصفحة الزبون</button>
  </div>

  <!-- قائمة الأصناف والتعديل -->
  <div class="card">
    <h3 style="color:#ffe082; margin-bottom:15px;">3️⃣ الأصناف الموجودة (تعديل وتحديث فوري)</h3>
    <div id="itemsContainer">جاري التحميل...</div>
  </div>

  <!-- رسالة التنبيه الفورية -->
  <div id="statusToast"></div>

  <script>
    const GITHUB_OWNER = "wahhidict";
    const GITHUB_REPO = "salah";
    const FILE_PATH = "data.json";

    let appData = { items: [] };

    document.addEventListener("DOMContentLoaded", () => {
      fetchData();
    });

    function getStoredToken() {
      let token = localStorage.getItem("gh_token");
      if (!token) {
        token = prompt("🔑 يرجى لصق رمز التوكن الخاص بك لمرة واحدة فقط لتفعيل التحديث التلقائي:");
        if (token && token.trim() !== "") {
          token = token.trim();
          localStorage.setItem("gh_token", token);
        }
      }
      return token;
    }

    function resetToken() {
      localStorage.removeItem("gh_token");
      alert("تم إزالة التوكن من متصفحك. سيُطلب منك إدخاله مجدداً عند إجراء التحديث القادم.");
    }

    function fetchData() {
      fetch(`data.json?t=${Date.now()}`)
        .then(res => {
          if (!res.ok) throw new Error("تعذر جلب البيانات");
          return res.json();
        })
        .then(data => {
          appData = data;
          loadAdminData();
        })
        .catch(err => {
          console.error(err);
          document.getElementById('itemsContainer').innerHTML = '<p style="color:#e74c3c;">تنبيه: تعذر جلب data.json.</p>';
        });
    }

    function loadAdminData() {
      document.getElementById('waNum').value = appData.whatsapp_number || "";
      document.getElementById('phoneNum').value = appData.phone_number || "";
      document.getElementById('statusTxt').value = appData.status_text || "";
      document.getElementById('tickerTxt').value = appData.ticker_text || "";

      renderItemsList();
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("statusToast");
      toast.innerText = msg;
      toast.className = isError ? "error" : "";
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 4000);
    }

    async function syncToGitHub(commitMsg) {
      const token = getStoredToken();
      if (!token) {
        alert("لم يتم إدخال التوكن! لا يمكن التحديث بدون التوكن.");
        return false;
      }

      showToast("⏳ جاري نشر التحديثات فوراً لصفحة الزبون...");

      try {
        const getRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}?t=${Date.now()}`, {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        let sha = "";
        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
        }

        const jsonString = JSON.stringify(appData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const bodyData = {
          message: commitMsg || "تحديث المنيو من لوحة التحكم",
          content: base64Content
        };
        if (sha) bodyData.sha = sha;

        const putRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(bodyData)
        });

        if (putRes.ok) {
          showToast("✅ تم التحديث بنجاح! سينعكس التغيير على صفحة الزبون مباشرة.");
          return true;
        } else {
          const errData = await putRes.json();
          showToast("❌ فشل التحديث: " + (errData.message || "تأكد من صحة التوكن"), true);
          return false;
        }
      } catch (err) {
        showToast("❌ خطأ في الاتصال: " + err.message, true);
        return false;
      }
    }

    function saveGeneralSettings() {
      appData.whatsapp_number = document.getElementById('waNum').value.trim();
      appData.phone_number = document.getElementById('phoneNum').value.trim();
      appData.status_text = document.getElementById('statusTxt').value.trim();
      appData.ticker_text = document.getElementById('tickerTxt').value.trim();

      syncToGitHub("تحديث الإعدادات العامة للمحل");
    }

    function handleImageUpload(input) {
      const file = input.files[0];
      if (file) {
        document.getElementById('fileStatusText').innerText = "جاري معالجة الصورة: " + file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('newItemImgBase64').value = e.target.result;
          document.getElementById('fileStatusText').innerText = "تم اختيار الصورة بنجاح ✅";
        };
        reader.readAsDataURL(file);
      }
    }

    async function addNewItem() {
      const name = document.getElementById('newItemName').value.trim();
      const cat = document.getElementById('newItemCat').value.trim();
      const desc = document.getElementById('newItemDesc').value.trim();
      const price = document.getElementById('newItemPrice').value.trim();
      const img = document.getElementById('newItemImgBase64').value || "https://images.unsplash.com/photo-1553530666-ba11a7da3888?auto=format&fit=crop&w=600&q=80";

      if(!name || !cat || !price) {
        alert("يرجى إدخال اسم الصنف والتصنيف والسعر على الأقل");
        return;
      }

      if (!appData.items) appData.items = [];

      appData.items.push({
        id: Date.now(),
        name: name,
        category: cat,
        description: desc,
        price: price,
        available: true,
        image: img
      });

      const success = await syncToGitHub(`إضافة صنف جديد: ${name}`);
      if (success) {
        renderItemsList();
        document.getElementById('newItemName').value = "";
        document.getElementById('newItemCat').value = "";
        document.getElementById('newItemDesc').value = "";
        document.getElementById('newItemPrice').value = "";
        document.getElementById('newItemImgBase64').value = "";
        document.getElementById('fileStatusText').innerText = "اضغط هنا لاختيار صورة من استوديو الموبايل";
      }
    }

    function renderItemsList() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      if (!appData.items || appData.items.length === 0) {
        container.innerHTML = '<p style="color:#a4c2b2;">لا توجد أصناف حالياً.</p>';
        return;
      }

      appData.items.forEach((item, index) => {
        container.innerHTML += `
          <div class="item-card-admin">
            <div class="item-row">
              <img src="${item.image}" class="preview-img" onerror="this.src='https://via.placeholder.com/65'">
              <div style="flex:1;">
                <strong style="font-size:1rem;">${item.name}</strong>
                <div style="font-size:0.8rem; color:#ffe082;">${item.price} • ${item.category}</div>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
                <button class="btn btn-sm btn-blue" onclick="toggleEditForm(${index})">تعديل ✏️</button>
                <button class="btn btn-sm ${item.available ? 'btn-green' : ''}" onclick="toggleAvail(${index})">${item.available ? 'متوفر' : 'غير متوفر'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteItem(${index})">حذف 🗑️</button>
              </div>
            </div>

            <div class="edit-form" id="editForm_${index}">
              <label>اسم الصنف:</label>
              <input type="text" id="editName_${index}" value="${item.name}">
              
              <label>التصنيف:</label>
              <input type="text" id="editCat_${index}" value="${item.category}">

              <label>الوصف:</label>
              <input type="text" id="editDesc_${index}" value="${item.description || ''}">

              <label>السعر:</label>
              <input type="text" id="editPrice_${index}" value="${item.price}">

              <label>تغيير الصورة:</label>
              <input type="file" accept="image/*" onchange="handleEditImageUpload(this, ${index})">

              <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-green btn-sm" onclick="saveItemEdit(${index})">حفظ التعديلات ونشرها فوراً ✅</button>
                <button class="btn btn-danger btn-sm" onclick="toggleEditForm(${index})">إلغاء</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function toggleEditForm(index) {
      const form = document.getElementById(`editForm_${index}`);
      form.style.display = (form.style.display === "block") ? "none" : "block";
    }

    function handleEditImageUpload(input, index) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          appData.items[index].image = e.target.result;
          alert("تم تحديث الصورة محلياً، اضغط زر حفظ التعديلات لنشرها.");
        };
        reader.readAsDataURL(file);
      }
    }

    async function saveItemEdit(index) {
      appData.items[index].name = document.getElementById(`editName_${index}`).value.trim();
      appData.items[index].category = document.getElementById(`editCat_${index}`).value.trim();
      appData.items[index].description = document.getElementById(`editDesc_${index}`).value.trim();
      appData.items[index].price = document.getElementById(`editPrice_${index}`).value.trim();

      const success = await syncToGitHub(`تعديل صنف: ${appData.items[index].name}`);
      if (success) {
        renderItemsList();
      }
    }

    async function toggleAvail(index) {
      appData.items[index].available = !appData.items[index].available;
      const success = await syncToGitHub(`تغيير حالة الصنف: ${appData.items[index].name}`);
      if (success) {
        renderItemsList();
      }
    }

    async function deleteItem(index) {
      if(confirm('هل أنت تأكد من حذف هذا الصنف؟')) {
        const deletedName = appData.items[index].name;
        appData.items.splice(index, 1);
        const success = await syncToGitHub(`حذف صنف: ${deletedName}`);
        if (success) {
          renderItemsList();
        }
      }
    }
  </script>
</body>
</html>
